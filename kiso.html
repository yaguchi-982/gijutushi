<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5A45">
<title>基礎科目 演習ノート｜技術士第一次試験</title>
<style>
:root{
  color-scheme: light;
  --paper:#F4F6F2;
  --grid:rgba(46,90,69,.08);
  --surface:#FFFFFF;
  --ink:#1D2823;
  --ink2:#56655D;
  --rule:#C9D3CC;
  --cover:#2E5A45;
  --cover-ink:#EFF5F1;
  --ok:#2E7550;
  --ok-bg:#E2EFE7;
  --shu:#C43E26;
  --shu-bg:#FAE8E3;
  --focus:#1F6FB2;
  --on-bg:#2E5A45;
  --on-border:#2E5A45;
  --on-ink:#EFF5F1;
  --primary-ink:#FFFFFF;
  --pfill:#2E5A45;
  --mincho:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#131916;
    --grid:rgba(170,210,190,.05);
    --surface:#1A221E;
    --ink:#E2E9E4;
    --ink2:#9BABA2;
    --rule:#34423B;
    --cover:#1E3a2D;
    --cover-ink:#E2EEE7;
    --ok:#7CC79E;
    --ok-bg:#1D3328;
    --shu:#F0806A;
    --shu-bg:#3A221D;
    --focus:#7DB8F0;
    --on-bg:#1D3328;
    --on-border:#7CC79E;
    --on-ink:#E2E9E4;
    --primary-ink:#1A0F0C;
    --pfill:#7CC79E;
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#131916;
    --grid:rgba(170,210,190,.05);
    --surface:#1A221E;
    --ink:#E2E9E4;
    --ink2:#9BABA2;
    --rule:#34423B;
    --cover:#1E3a2D;
    --cover-ink:#E2EEE7;
    --ok:#7CC79E;
    --ok-bg:#1D3328;
    --shu:#F0806A;
    --shu-bg:#3A221D;
    --focus:#7DB8F0;
    --on-bg:#1D3328;
    --on-border:#7CC79E;
    --on-ink:#E2E9E4;
    --primary-ink:#1A0F0C;
    --pfill:#7CC79E;
  }
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--cover)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:20px 20px;
  color:var(--ink);
  font-family:var(--gothic);
  font-size:16px;
  line-height:1.7;
  min-height:100%;
}
.opt,.chip,.ghost,.primary{touch-action:manipulation}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* 表紙帯 */
.cover{background:var(--cover);color:var(--cover-ink)}
.cover-inner{max-width:760px;margin:0 auto;padding:18px 20px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cover h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.04em}
.cover .sub{font-size:.8rem;opacity:.8;margin:0}
.count{text-align:right}
.count b{font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count small{display:block;font-size:.78rem;opacity:.85}

main{max-width:760px;margin:0 auto;padding:24px 20px 64px}
section{margin-bottom:32px}
h2{font-size:1.02rem;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.muted{color:var(--ink2);font-size:.85rem}

/* 群別の成績 */
.summary{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 14px;font-size:.9rem}
.summary b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.grp{display:grid;grid-template-columns:11.5em 1fr 6.5em;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.grp .name{font-size:.92rem}
.grp .name span{color:var(--ink2);font-size:.8rem;margin-right:.4em}
.bar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.grp .num{text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .grp{grid-template-columns:1fr 5.5em}
  .grp .bar{grid-column:1 / -1;grid-row:2}
}

/* 出題設定 */
.field{margin-bottom:16px}
.field > .label{font-size:.85rem;color:var(--ink2);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--rule);background:var(--surface);
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.9rem;
}
.chip[aria-pressed="true"]{border-color:var(--on-border);background:var(--on-bg);color:var(--on-ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip small{opacity:.75;margin-left:.3em;font-variant-numeric:tabular-nums}

.primary{
  display:inline-block;border:0;border-radius:8px;cursor:pointer;
  background:var(--shu);color:var(--primary-ink);font-weight:700;padding:12px 22px;font-size:1rem;
}
.primary:disabled{background:var(--rule);color:var(--ink2);cursor:not-allowed}
.ghost{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:9px 16px;cursor:pointer}
.link{border:0;background:none;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem}
.warn{color:var(--shu);font-size:.85rem;margin-top:8px}

/* 出題画面 */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.progress{font-variant-numeric:tabular-nums;font-weight:700}
.ptrack{height:4px;background:var(--rule);border-radius:2px;margin-bottom:20px;overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--pfill)}
.flag[aria-pressed="true"]{border-color:#C9A227;background:#F6E7A8;color:#3B2F00}

.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:22px 22px 18px;position:relative}
.gtag{font-size:.8rem;color:var(--ink2);margin:0 0 10px}
.qtext{white-space:pre-line;font-family:var(--mincho);font-size:1.08rem;line-height:1.95;margin:0 0 18px;padding-right:8px}
.fig{margin:-4px 0 18px;color:var(--ink);text-align:center}
.fig svg{display:inline-block;width:100%;max-width:420px;max-height:230px;height:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fig svg text{fill:currentColor;stroke:none;font-size:14px;font-family:var(--gothic)}
.fig .thin{stroke-width:1}
.fig .fillc{fill:currentColor;stroke:none}
.fig .dash{stroke-dasharray:5 4;stroke-width:1.2}
.fig .shade{fill:var(--ok-bg)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{
  width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;
  background:transparent;border:1.5px solid var(--rule);border-radius:6px;
  padding:10px 12px;cursor:pointer;font-family:var(--mincho);font-size:1rem;line-height:1.7;
}
.opt:hover:not(:disabled){border-color:var(--ink2)}
.opt .n{font-family:var(--gothic);font-weight:700;flex:none;width:1.4em}
.opt:disabled{cursor:default}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-wrong{border-color:var(--shu);background:var(--shu-bg)}

.mark{position:absolute;right:10px;top:-16px;width:92px;height:92px;fill:none;stroke:var(--shu);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.88;pointer-events:none}
.mark path{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .42s ease-out forwards}
.mark path + path{animation-delay:.2s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){ .mark path{animation:none;stroke-dashoffset:0} }

.explain{margin-top:18px;border-left:4px solid var(--shu);padding:4px 0 4px 14px}
.explain .verdict{font-weight:700;margin:0 0 4px}
.explain p{margin:0}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.keys{font-size:.78rem;color:var(--ink2)}
@media (hover:none){ .keys{display:none} }
@media (max-width:560px){
  main{padding:18px 14px 48px}
  .sheet{padding:18px 14px 14px}
  .cover-inner{padding:14px 14px 12px}
  .mark{width:72px;height:72px;right:4px;top:-12px}
  .next-row .primary{width:100%}
  .actions .primary,.actions .ghost{flex:1 1 100%}
}

/* 結果 */
.score{font-size:2.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin:0}
.score small{font-size:1rem;font-weight:400;color:var(--ink2);margin-left:.4em}
.miss{border-bottom:1px solid var(--rule);padding:10px 0}
.miss .q{font-family:var(--mincho);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0}
.miss .a{font-size:.85rem}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}

footer.note{border-top:1px solid var(--rule);padding-top:14px;font-size:.8rem;color:var(--ink2)}
footer.note p{margin:0 0 6px}
</style>
</head>
<body>
<header class="cover">
  <div class="cover-inner">
    <div>
      <h1>基礎科目 演習ノート</h1>
      <p class="sub">技術士第一次試験</p>
    </div>
    <div class="count" id="countdown"></div>
  </div>
</header>
<main id="app"></main>

<script>
const GROUPS = {
  1: "設計・計画",
  2: "情報・論理",
  3: "解析",
  4: "材料・化学・バイオ",
  5: "環境・エネルギー・技術"
};
const NUMS = ["①","②","③","④","⑤"];
const YEARS = [["R7","令和7年度"],["R6","令和6年度"],["R5","令和5年度"],["R4","令和4年度"],["R3","令和3年度"],["B","基本問題"]];
const YORDER = Object.fromEntries(YEARS.map((y,i)=>[y[0],i]));
function qLabel(q){ return q.y==="B" ? "基本問題" : YEARS[YORDER[q.y]][1]+"　Ⅰ-"+q.g+"-"+q.k+"の類題"; }

/* 基本問題（y:"B"）と、令和3〜7年度の各問と同じテーマの類題（y:"R3"〜"R7"）。a は正解の添字 */
const QUESTIONS = [
/* 1群 設計・計画 */
{id:"1-01",y:"B",g:1,q:"信頼度がそれぞれ0.9である3つの要素を直列に接続したシステムの信頼度はどれか。",
 o:["0.271","0.729","0.810","0.900","0.999"],a:1,
 e:"直列系はすべての要素が正常なときだけ動作するので、信頼度は各要素の積になる。0.9×0.9×0.9＝0.729。直列の要素が増えるほど全体の信頼度は下がる。"},
{id:"1-02",y:"B",g:1,q:"信頼度0.8の要素2つを並列に接続したシステム（どちらか一方が動作すればよい）の信頼度はどれか。",
 o:["0.64","0.80","0.90","0.96","0.99"],a:3,
 e:"並列系は「全部が同時に故障する確率」を1から引く。1−(1−0.8)²＝1−0.04＝0.96。"},
{id:"1-03",y:"B",g:1,q:"信頼度0.9の要素2つを並列にした部分に、信頼度0.9の要素1つを直列に接続したシステムの信頼度はどれか。",
 o:["0.729","0.810","0.891","0.981","0.999"],a:2,
 e:"まず並列部分を1つの要素にまとめる：1−0.1²＝0.99。これと0.9を直列にして 0.99×0.9＝0.891。直並列は「並列部分を先にまとめる」のが定石。"},
{id:"1-04",y:"B",g:1,q:"ある設備の平均故障間隔（MTBF）が900時間、平均修復時間（MTTR）が100時間であるとき、アベイラビリティ（稼働率）はどれか。",
 o:["0.10","0.80","0.90","0.99","9.0"],a:2,
 e:"アベイラビリティ＝MTBF÷(MTBF＋MTTR)＝900÷1000＝0.90。"},
{id:"1-05",y:"B",g:1,q:"故障率が一定で λ＝0.002［1/時間］である機器の平均故障間隔（MTBF）はどれか。",
 o:["0.002時間","50時間","200時間","500時間","2000時間"],a:3,
 e:"故障率が一定のとき MTBF＝1/λ＝1/0.002＝500時間。"},
{id:"1-06",y:"B",g:1,q:"製品Aは1個あたり利益3万円、製品Bは1個あたり利益2万円である。材料の制約が A＋B≦4、機械時間の制約が 2A＋B≦6（A, B≧0、実数でよい）のとき、利益の最大値はどれか。",
 o:["8万円","9万円","10万円","11万円","12万円"],a:2,
 e:"線形計画法では、制約で囲まれた領域の頂点で最大になる。頂点は (0,0)→0、(3,0)→9、(0,4)→8、2式の交点 (2,2)→3×2＋2×2＝10。最大は10万円。"},
{id:"1-07",y:"B",g:1,q:"QC七つ道具に含まれないものはどれか。",
 o:["パレート図","特性要因図","管理図","連関図","散布図"],a:3,
 e:"QC七つ道具はパレート図、特性要因図、ヒストグラム、散布図、管理図、チェックシート、グラフ（層別）。連関図は言語データを扱う「新QC七つ道具」の一つ。"},
{id:"1-08",y:"B",g:1,q:"ユニバーサルデザインの7原則に含まれないものはどれか。",
 o:["誰でも公平に利用できる","使い方が単純で直感的にわかる","失敗やミスに対して寛大である","少ない身体的負担で利用できる","見た目の美しさを最優先する"],a:4,
 e:"7原則は、公平な利用、利用の柔軟性、単純で直感的な利用、認知できる情報、失敗に対する寛大さ、少ない身体的努力、接近・利用のための大きさと空間。審美性は含まれない。"},
{id:"1-09",y:"B",g:1,q:"「利用者が誤った操作をしても危険な状態にならない、または誤操作そのものができないようにする」設計の考え方はどれか。",
 o:["フェールセーフ","フールプルーフ","冗長設計","ディレーティング","タンパープルーフ"],a:1,
 e:"フールプルーフは人の誤操作への対策。フェールセーフは「故障したときに安全側に止まる」設計で、混同しやすいので対で覚える。冗長設計は予備系を持たせること、ディレーティングは定格より余裕をもって使うこと。"},
{id:"1-10",y:"B",g:1,q:"窓口に客が平均4人/時でランダムに到着し、平均5人/時の能力で1人ずつ処理される（M/M/1モデル）。系内にいる客の平均人数はどれか。",
 o:["0.8人","1.25人","3.2人","4人","5人"],a:3,
 e:"利用率 ρ＝λ/μ＝4/5＝0.8。系内平均人数 L＝ρ/(1−ρ)＝0.8/0.2＝4人。ρが1に近づくと急激に混雑する。"},

/* 2群 情報・論理 */
{id:"2-01",y:"B",g:2,q:"10進数の25を2進数で表したものはどれか。",
 o:["10011","10101","11001","11010","11100"],a:2,
 e:"25＝16＋8＋1 なので、16の位・8の位・1の位が1 → 11001。2で割り続けて余りを下から読む方法でもよい。"},
{id:"2-02",y:"B",g:2,q:"10進数の0.625を2進数で表したものはどれか。",
 o:["0.011","0.101","0.110","0.0101","0.1001"],a:1,
 e:"0.625＝0.5＋0.125＝2⁻¹＋2⁻³ なので 0.101。小数部は2を掛けて整数部を上から読む（0.625→1.25→0.5→1.0 で 1,0,1）。"},
{id:"2-03",y:"B",g:2,q:"2進数 10110110 を16進数で表したものはどれか。",
 o:["6B","96","A6","B6","D6"],a:3,
 e:"下位から4桁ずつ区切る：1011｜0110 → B（＝11）と 6 → B6。"},
{id:"2-04",y:"B",g:2,q:"論理式 NOT (A AND B) と常に等しいものはどれか。",
 o:["(NOT A) AND (NOT B)","(NOT A) OR (NOT B)","A OR B","(NOT A) OR B","A AND (NOT B)"],a:1,
 e:"ド・モルガンの法則：NOT(A AND B)＝(NOT A) OR (NOT B)、NOT(A OR B)＝(NOT A) AND (NOT B)。否定を分配するとANDとORが入れ替わる。"},
{id:"2-05",y:"B",g:2,q:"中置記法の式 (A＋B)×(C−D) を逆ポーランド記法（後置記法）で表したものはどれか。",
 o:["AB＋CD−×","A＋B×C−D","ABCD＋−×","AB×CD＋−","AB＋C×D−"],a:0,
 e:"演算子を2つの被演算子の後ろに置く。(A＋B)→AB＋、(C−D)→CD−、その積→AB＋CD−×。⑤は ((A＋B)×C)−D を表す。"},
{id:"2-06",y:"B",g:2,q:"公開鍵暗号方式で、AさんがBさんに秘密のメッセージを送るとき、Aさんが暗号化に使う鍵はどれか。",
 o:["Aさんの秘密鍵","Aさんの公開鍵","Bさんの公開鍵","Bさんの秘密鍵","AさんとBさんの共通鍵"],a:2,
 e:"受信者（B）の公開鍵で暗号化し、B本人だけが持つ秘密鍵で復号する。「受け取る人の鍵で閉じる」と覚える。"},
{id:"2-07",y:"B",g:2,q:"デジタル署名で、送信者が署名を生成するときに使う鍵はどれか。",
 o:["送信者の秘密鍵","送信者の公開鍵","受信者の公開鍵","受信者の秘密鍵","認証局の公開鍵"],a:0,
 e:"署名は送信者の秘密鍵で作り、受信者は送信者の公開鍵で検証する。暗号化（受信者の公開鍵を使う）とは向きが逆なのでセットで覚える。"},
{id:"2-08",y:"B",g:2,q:"32通りの事象を区別するために最低限必要なビット数はどれか。",
 o:["4ビット","5ビット","6ビット","16ビット","32ビット"],a:1,
 e:"nビットで2ⁿ通りを表せる。2⁵＝32なので5ビット。"},
{id:"2-09",y:"B",g:2,q:"金融機関などを装ったメールで偽のWebサイトに誘導し、IDやパスワードを入力させて盗み取る攻撃はどれか。",
 o:["フィッシング","ランサムウェア","DoS攻撃","SQLインジェクション","ゼロデイ攻撃"],a:0,
 e:"ランサムウェアはデータを暗号化して身代金を要求、DoS攻撃は大量のアクセスでサービスを停止させる、SQLインジェクションは不正なSQL文でデータベースを操作、ゼロデイ攻撃は修正プログラム公開前の脆弱性を突く攻撃。"},
{id:"2-10",y:"B",g:2,q:"要素数 n のソート済み配列に対する二分探索の計算量（オーダー）はどれか。",
 o:["O(1)","O(log n)","O(n)","O(n log n)","O(n²)"],a:1,
 e:"1回の比較で探索範囲が半分になるので、log₂n 回程度で済む。先頭から順に調べる線形探索は O(n)。"},
{id:"2-11",y:"B",g:2,q:"100人に調査したところ、Aを好む人が60人、Bを好む人が50人、両方を好む人が30人だった。AもBも好まない人は何人か。",
 o:["10人","20人","30人","40人","80人"],a:1,
 e:"AまたはBを好む人＝60＋50−30＝80人。どちらも好まない人は100−80＝20人。ベン図を描くと確実。"},

/* 3群 解析 */
{id:"3-01",y:"B",g:3,q:"関数 f(x)＝x³ の x＝2 における微分係数はどれか。",
 o:["4","6","8","12","24"],a:3,
 e:"f′(x)＝3x² なので f′(2)＝3×4＝12。"},
{id:"3-02",y:"B",g:3,q:"関数 f(x) の1階微分を、刻み幅 h を用いて2次精度で近似する中心差分の式はどれか。",

{id:"3-03",y:"B",g:3,q:"定積分 ∫₀¹ (2x＋1) dx の値はどれか。",

{id:"3-04",y:"B",g:3,q:"ばね定数 k のばね2本を直列につないだときの合成ばね定数はどれか。",

{id:"3-06",y:"B",g:3,q:"断面積100mm²の棒に1kNの引張荷重が作用している。棒に生じる引張応力はどれか。",

{id:"3-07",y:"B",g:3,q:"長さ3mの片持ちはりの自由端に2kNの集中荷重が作用している。固定端に生じる曲げモーメントの大きさはどれか。",

{id:"3-08",y:"B",g:3,q:"スパン4mの単純支持はりの中央に8kNの集中荷重が作用している。最大曲げモーメントはどれか。",

{id:"3-09",y:"B",g:3,q:"2行2列の行列（1行目が 2, 1、2行目が 3, 4）の行列式の値はどれか。",

{id:"3-10",y:"B",g:3,q:"ベクトル a＝(1, 2, 3) と b＝(3, 0, k) が直交するとき、k の値はどれか。",

{id:"4-01",y:"B",g:4,q:"水酸化ナトリウム（NaOH、モル質量40g/mol）4.0gを水に溶かして500mLとした溶液のモル濃度はどれか。",

{id:"4-04",y:"B",g:4,q:"ステンレス鋼の耐食性に主に寄与している元素はどれか。",

{id:"4-05",y:"B",g:4,q:"次の金属のうち、密度が最も小さいものはどれか。",

{id:"4-06",y:"B",g:4,q:"DNAの二重らせんで、アデニン（A）と相補的に対をなす塩基はどれか。",

{id:"4-07",y:"B",g:4,q:"DNAには含まれず、RNAに含まれる塩基はどれか。",

{id:"4-09",y:"B",g:4,q:"mRNA上の連続する3塩基（コドン）の組合せは全部で何通りか。",

{id:"5-05",y:"B",g:5,q:"次のうち、二次エネルギーに分類されるものはどれか。",

QUESTIONS.push(...[{"id": "R3-1-1", "y": "R3", "g": 1, "k": 1, "q": "ユニバーサルデザインの考え方に基づく製品の説明として、最も不適切なものはどれか。", "o": ["音と光の両方で状態を知らせる家電", "握力の弱い人でも開けやすいレバー式の取っ手", "左右どちらの手でも同じように使えるはさみ", "誤操作をしても簡単に元の状態に戻せる操作パネル", "特定の障害のある人だけが使えるように専用に設計し、他の人は使えない機器"], "a": 4, "e": "ユニバーサルデザインは、障害の有無や年齢にかかわらず「できるだけ多くの人」が使えるように最初から設計する考え方。特定の人専用に作るのは考え方が異なる。"}, {"id": "R3-1-2", "y": "R3", "g": 1, "k": 2, "q": "信頼度がそれぞれ0.9、0.8、0.7である互いに独立な3個の要素を、すべて並列に接続したシステムの信頼度はどれか。", "o": ["0.940", "0.994", "0.999", "0.886", "0.504"], "a": 1, "e": "並列は「全部が同時に故障する確率」を1から引く。1−(0.1×0.2×0.3)＝1−0.006＝0.994。なお、3個を直列にすると 0.9×0.8×0.7＝0.504 となる。"}, {"id": "R3-1-3", "y": "R3", "g": 1, "k": 3, "q": "PDCAサイクルに関する記述として、最も不適切なものはどれか。", "o": ["Pは目標と、それを達成するための計画を立てる段階である", "PDCAサイクルは一度回して目標を達成したら終了し、繰り返さないのが原則である", "Cは実施結果を測定し、計画と比べて評価する段階である", "Aは評価結果をもとに改善策を講じる段階である", "Dは計画に沿って実施する段階である"], "a": 1, "e": "PDCAは繰り返し回して水準を少しずつ高めていく（スパイラルアップ）ことが前提。一度で終わりにはしない。"}, {"id": "R3-1-4", "y": "R3", "g": 1, "k": 4, "q": "ある装置の平均故障間隔（MTBF）が450時間、平均修復時間（MTTR）が50時間である。保全体制を見直してMTTRを半分にしたときのアベイラビリティに最も近い値はどれか。", "o": ["0.99", "0.92", "0.90", "0.97", "0.95"], "a": 4, "e": "A＝MTBF÷(MTBF＋MTTR)。見直し前は450÷500＝0.90、MTTRを25時間にすると 450÷475≒0.947 で約0.95。"}, {"id": "R3-1-5", "y": "R3", "g": 1, "k": 5, "q": "構造設計に関する記述として、最も不適切なものはどれか。", "o": ["繰返し荷重を受けると、静的な強度より低い応力で疲労破壊することがある", "座屈は、短く太い柱ほど起こりやすい", "切欠きや穴の周辺では応力集中が生じる", "安全率は、基準強さを許容応力で割った値である", "高温で一定の荷重を受け続けると、時間とともに変形が進むクリープが生じる"], "a": 1, "e": "座屈は細長い柱ほど起こりやすい。オイラーの座屈荷重は長さの2乗に反比例する。"}, {"id": "R3-1-6", "y": "R3", "g": 1, "k": 6, "q": "製図法に関する記述として、最も不適切なものはどれか。", "o": ["第三角法では、右側面図は正面図の右に描く", "中心線には細い一点鎖線を用いる", "長さの寸法は原則としてミリメートル単位で記入し、単位記号は付けない", "第一角法では、平面図は正面図の上に描く", "第三角法では、平面図は正面図の上に描く"], "a": 3, "e": "第一角法では見る方向と反対側に描くため、平面図は正面図の下、右側面図は正面図の左になる。第三角法は見る側と同じ側に描く。"}, {"id": "R4-1-1", "y": "R4", "g": 1, "k": 1, "q": "金属材料の一般的性質に関する記述として、最も不適切なものはどれか。", "o": ["一般に純金属は、同じ金属を主成分とする合金よりも電気抵抗率が大きい", "一般に温度が上がると電気抵抗は大きくなる", "自由電子をもつため、電気や熱をよく伝える", "延性や展性があり、引き延ばしたり薄く広げたりできる", "純金属に他の元素を加えて合金にすると、一般に強度が増す"], "a": 0, "e": "合金は異種原子が自由電子の流れを乱すため、一般に純金属より電気抵抗率が大きい。"}, {"id": "R4-1-2", "y": "R4", "g": 1, "k": 2, "q": "確率分布に関する記述として、最も不適切なものはどれか。", "o": ["ポアソン分布では平均と分散が等しい", "指数分布は「無記憶性」をもつ", "成功確率pの試行をn回行う二項分布の平均はnpである", "区間[a, b]の一様分布の分散は、区間の幅に関係しない", "正規分布は平均値を中心に左右対称である"], "a": 3, "e": "一様分布の分散は (b−a)²/12 で、区間の幅が広いほど大きくなる。"}, {"id": "R4-1-3", "y": "R4", "g": 1, "k": 3, "q": "互いに独立な引張力Fa（平均100 N、標準偏差3 N）とFb（平均200 N、標準偏差4 N）が同じ棒に同時に作用する。合計の引張力の標準偏差はどれか。", "o": ["12 N", "5 N", "7 N", "1 N", "25 N"], "a": 1, "e": "独立な確率変数の和の分散は各分散の和。√(3²＋4²)＝5 N。標準偏差そのものを足して7 Nとしないこと。"}, {"id": "R4-1-4", "y": "R4", "g": 1, "k": 4, "q": "ある製品の安全率をx（x≧1）とする。製造コストはx［百万円］、損傷が生じる確率は0.04/x²、損傷時の損失は100［百万円］である。製造コストと期待損失の合計を最小にする安全率はどれか。", "o": ["2.5", "2", "1.5", "3", "4"], "a": 1, "e": "合計 C＝x＋100×0.04/x²＝x＋4/x²。dC/dx＝1−8/x³＝0 より x³＝8、x＝2。このとき C＝2＋1＝3［百万円］。"}, {"id": "R4-1-5", "y": "R4", "g": 1, "k": 5, "q": "円形断面のはりで、断面の直径だけを2倍にした。同じ荷重を受けるときの最大曲げ応力は元の何倍になるか。", "o": ["1/2倍", "1/4倍", "1/8倍", "1/16倍", "2倍"], "a": 2, "e": "曲げ応力 σ＝M/Z、円形断面の断面係数 Z＝πd³/32。dが2倍でZは8倍になり、応力は1/8倍。なお、たわみは断面二次モーメント（d⁴に比例）で決まるので1/16倍。"}, {"id": "R4-1-6", "y": "R4", "g": 1, "k": 6, "q": "施設の計画案ア〜オについて、将来の社会条件a、b、cのもとでの便益［億円］と建設費用［億円］が次のとおりである。条件の発生確率がa＝60%、b＝30%、c＝10%のとき、期待される価値（＝便益の期待値−費用）が最も大きい案はどれか。\nア：便益 6／4／2、費用3\nイ：便益 8／2／0、費用4\nウ：便益 5／5／5、費用2.5\nエ：便益 7／5／1、費用4\nオ：便益 4／4／8、費用2", "o": ["オ", "エ", "ウ", "イ", "ア"], "a": 2, "e": "ア 3.6＋1.2＋0.2−3＝2.0、イ 4.8＋0.6−4＝1.4、ウ 5−2.5＝2.5、エ 4.2＋1.5＋0.1−4＝1.8、オ 2.4＋1.2＋0.8−2＝2.4。最大はウ。"}, {"id": "R5-1-1", "y": "R5", "g": 1, "k": 1, "q": "鉄鋼とCFRP（炭素繊維強化プラスチック）の比較に関する記述として、最も不適切なものはどれか。", "o": ["CFRPは一般に鉄鋼よりも密度が大きい", "CFRPは繊維の方向によって強度が異なる異方性をもつ", "CFRPは鉄鋼に比べて比強度（強度÷密度）が大きい", "鉄鋼は破断前に塑性変形しやすく、延性的に壊れやすい", "CFRPは鉄鋼に比べて比剛性が大きい"], "a": 0, "e": "CFRPの密度は約1.6 g/cm³で、鉄鋼（約7.9 g/cm³）の約1/5。軽くて強いのが最大の特長。"}, {"id": "R5-1-2", "y": "R5", "g": 1, "k": 2, "q": "両端を回転自由に支持した長柱のオイラー座屈荷重は P＝π²EI/L² で表される。材料と断面は変えずに柱の長さLを2倍にすると、座屈荷重は元の何倍になるか。", "o": ["2倍", "1/8倍", "1倍", "1/2倍", "1/4倍"], "a": 4, "e": "座屈荷重は長さの2乗に反比例するので 1/2²＝1/4倍。"}, {"id": "R5-1-3", "y": "R5", "g": 1, "k": 3, "q": "材料の応力−ひずみ線図に関する記述として、最も不適切なものはどれか。", "o": ["弾性域では応力とひずみがほぼ比例する（フックの法則）", "明瞭な降伏点がない材料では、0.2%の永久ひずみを生じる応力（0.2%耐力）を降伏応力の代わりに用いる", "引張強さは、最大荷重を元の断面積で割った値である", "ヤング率は、塑性域における応力−ひずみ線図の傾きである", "降伏点を超えて荷重を除くと、永久ひずみが残る"], "a": 3, "e": "ヤング率（縦弾性係数）は弾性域の直線部分の傾き。塑性域の傾きではない。"}, {"id": "R5-1-4", "y": "R5", "g": 1, "k": 4, "q": "3個の同じ要素のうち2個以上が正常なら系が正常に動作する2/3多数決冗長系がある。各要素の信頼度が0.8で、故障は互いに独立のとき、系の信頼度はどれか。", "o": ["0.800", "0.992", "0.512", "0.640", "0.896"], "a": 4, "e": "「3個とも正常」と「ちょうど2個が正常」の確率の和。0.8³＋3×0.8²×0.2＝0.512＋0.384＝0.896（公式 3p²−2p³ でも同じ）。"}, {"id": "R5-1-5", "y": "R5", "g": 1, "k": 5, "q": "「製品を構成する部品ごとに起こり得る故障モードを洗い出し、それが上位のシステムに及ぼす影響を評価する」手法はどれか。", "o": ["PERT", "FMEA", "HAZOP", "ETA", "FTA"], "a": 1, "e": "FMEAは部品（下位）から上位への影響を追うボトムアップ型。FTAは望ましくない事象（頂上事象）から原因を掘り下げるトップダウン型。PERTは工程管理の手法。"}, {"id": "R5-1-6", "y": "R5", "g": 1, "k": 6, "q": "相関係数r（ピアソンの積率相関係数）に関する記述として、最も不適切なものはどれか。", "o": ["rが1に近ければ、一方が他方の原因であることが示される", "rは−1以上1以下の値をとる", "r＝0は直線的な関係がないことを示すが、曲線的な関係がある場合もある", "データの単位を変えてもrの値は変わらない", "rは外れ値の影響を受けやすい"], "a": 0, "e": "相関は因果関係を示さない。第三の要因による見かけの相関（疑似相関）もあり得る。"}, {"id": "R6-1-1", "y": "R6", "g": 1, "k": 1, "q": "「できるだけ多くの人が利用可能であるように製品や環境をデザインする」というユニバーサルデザインの考え方を提唱し、7原則をまとめた中心人物はどれか。", "o": ["ハーバート・サイモン", "W.E.デミング", "ドナルド・ノーマン", "ロナルド・メイス", "ピーター・ドラッカー"], "a": 3, "e": "ユニバーサルデザインはノースカロライナ州立大学のロナルド・メイスらが提唱した。ノーマンは「アフォーダンス」などデザインの認知面、デミングは品質管理（PDCA）で知られる。"}, {"id": "R6-1-2", "y": "R6", "g": 1, "k": 2, "q": "限界状態設計法に関する記述として、最も不適切なものはどれか。", "o": ["終局限界状態は、構造物が破壊したり耐荷力を失ったりする状態である", "許容応力度設計法と同じく、材料が弾性範囲にあることだけを確認すれば安全性の照査が完了する", "使用限界状態は、過大なたわみやひび割れなどで機能や美観が損なわれる状態である", "繰返し荷重に対する疲労限界状態を設定することがある", "荷重や材料強度のばらつきは、部分安全係数で考慮する"], "a": 1, "e": "限界状態設計法は、終局・使用・疲労など複数の限界状態を設定し、それぞれについて照査する。弾性範囲の応力だけをみる許容応力度設計法とは考え方が異なる。"}, {"id": "R6-1-3", "y": "R6", "g": 1, "k": 3, "q": "スパン6 mの単純支持はりに、2 kN/mの等分布荷重が全長にわたって作用している。最大曲げモーメントはどれか。", "o": ["4.5 kN·m", "18 kN·m", "6 kN·m", "12 kN·m", "9 kN·m"], "a": 4, "e": "等分布荷重の単純はりの最大曲げモーメントは中央で M＝wL²/8＝2×36/8＝9 kN·m。"}, {"id": "R6-1-4", "y": "R6", "g": 1, "k": 4, "q": "速度伝達比が20で、動力伝達効率がほぼ100%の減速歯車装置がある。入力軸に5 N·mのトルクを3000 rpmで与えたとき、出力軸のトルクはどれか。", "o": ["150 N·m", "100 N·m", "5 N·m", "50 N·m", "0.25 N·m"], "a": 1, "e": "損失がなければ動力（トルク×回転数）は一定。回転数が1/20（150 rpm）になる分、トルクは20倍の100 N·m。"}, {"id": "R6-1-5", "y": "R6", "g": 1, "k": 5, "q": "製品1を1 kg作るには原料Aが2 kg、原料Bが1 kg、製品2を1 kg作るには原料Aが1 kg、原料Bが3 kg必要である。利益は製品1が3千円/kg、製品2が4千円/kgで、使える原料はAが10 kg、Bが15 kgまでである。利益の最大値はどれか。", "o": ["23千円", "28千円", "15千円", "20千円", "25千円"], "a": 4, "e": "製品1をx、製品2をy［kg］とすると、2x＋y≦10、x＋3y≦15。頂点 (5,0)→15、(0,5)→20、2式の交点 (3,4)→3×3＋4×4＝25。最大は25千円。"}, {"id": "R6-1-6", "y": "R6", "g": 1, "k": 6, "q": "独立に製造された軸A1（長さの平均600 mm、標準偏差0.3 mm）と軸A2（平均400 mm、標準偏差0.4 mm）がある。A1の長さからA2の長さを引いた差の平均と標準偏差の組合せとして、最も適切なものはどれか。", "o": ["平均200 mm、標準偏差0.7 mm", "平均1000 mm、標準偏差0.7 mm", "平均200 mm、標準偏差0.5 mm", "平均200 mm、標準偏差0.1 mm", "平均1000 mm、標準偏差0.5 mm"], "a": 2, "e": "差の平均は 600−400＝200 mm。独立な変数の差でも分散は足し算になるので、標準偏差は √(0.3²＋0.4²)＝0.5 mm。"}, {"id": "R7-1-1", "y": "R7", "g": 1, "k": 1, "q": "構造物の設計に関する次の記述の（ア）（イ）に入る語句の組合せとして、最も適切なものはどれか。\n部材に生じる応力が材料の（ア）を超えないよう、（ア）を安全率で割った（イ）以下に抑えるように設計する。", "o": ["ア 許容応力　イ 基準強さ", "ア 基準強さ　イ ポアソン比", "ア 基準強さ　イ 許容応力", "ア 許容応力　イ 降伏ひずみ", "ア ヤング率　イ 許容応力"], "a": 2, "e": "許容応力＝基準強さ÷安全率。基準強さには、延性材料の静荷重なら降伏点（耐力）、脆性材料なら引張強さなどを用いる。"}, {"id": "R7-1-2", "y": "R7", "g": 1, "k": 2, "q": "PDCAサイクルの「C（Check）」に当たる活動として、最も適切なものはどれか。", "o": ["次のサイクルの予算を確保する", "実施した結果を測定し、目標や計画と比べて評価する", "評価結果をもとに、手順や標準を見直す", "決めた手順に従って作業を行う", "達成すべき目標と手順を決める"], "a": 1, "e": "P（計画）→D（実行）→C（評価）→A（改善）。Cは結果を測って計画と比べる段階。"}, {"id": "R7-1-3", "y": "R7", "g": 1, "k": 3, "q": "引張強さ400 MPaの材料を基準強さとし、安全率を4とする。許容応力はどれか。", "o": ["25 MPa", "100 MPa", "404 MPa", "1600 MPa", "396 MPa"], "a": 1, "e": "許容応力＝基準強さ÷安全率＝400÷4＝100 MPa。"}, {"id": "R7-1-4", "y": "R7", "g": 1, "k": 4, "q": "弾性論における平面応力状態と平面ひずみ状態に関する記述として、最も適切なものはどれか。", "o": ["平面ひずみ状態では、板厚方向の応力が0となる", "平面応力と平面ひずみの違いは、材料のヤング率だけで決まる", "薄い板が板の面内の荷重を受ける場合は、平面応力状態で近似できる", "厚い物体の厚さ方向中央部は、平面応力状態で近似するのが適切である", "平面応力状態では、板厚方向のひずみが必ず0となる"], "a": 2, "e": "薄板は板厚方向の応力が0とみなせる（平面応力）。長いダムやトンネルの断面のように厚さ方向に変形が拘束される場合は板厚方向のひずみが0（平面ひずみ）とみなす。"}, {"id": "R7-1-5", "y": "R7", "g": 1, "k": 5, "q": "窓口に客が1時間当たり平均30人のポアソン到着で来る。1人当たりの処理時間は平均1分の指数分布に従い、窓口は1つ（M/M/1）である。客がサービスを受けるまでの平均待ち時間はどれか。", "o": ["1分", "5分", "0.5分", "3分", "2分"], "a": 0, "e": "λ＝30人/時、μ＝60人/時で利用率ρ＝0.5。待ち時間 Wq＝ρ/(1−ρ)×平均処理時間＝1×1分＝1分。"}, {"id": "R7-1-6", "y": "R7", "g": 1, "k": 6, "q": "統計的検定に関する記述として、最も適切なものはどれか。", "o": ["標本の大きさを増やしても、検出力は変わらない", "p値は、帰無仮説が正しい確率である", "第2種の誤りとは、正しい帰無仮説を棄却してしまう誤りである", "有意水準5%で検定するとは、帰無仮説が正しいのに誤って棄却する確率（第1種の誤り）を5%以下に抑えることである", "「有意差なし」という結果は、帰無仮説が正しいことを証明している"], "a": 3, "e": "p値は「帰無仮説が正しいと仮定したとき、観測以上に極端な結果が得られる確率」。有意差なしは「差があるとは言えない」にとどまる。第2種の誤りは誤った帰無仮説を棄却できないこと。標本を増やすと検出力は上がる。"}, {"id": "R3-2-1", "y": "R3", "g": 2, "k": 1, "q": "情報セキュリティと暗号技術に関する記述として、最も適切なものはどれか。", "o": ["ハッシュ関数の出力値から、元のデータを計算で復元できる", "デジタル署名を付けると、通信内容を第三者に読まれないよう秘匿できる", "公開鍵暗号方式では、暗号化に使う鍵を公開しても、復号に使う鍵は秘密に保つことができる", "共通鍵暗号方式には、鍵を相手に安全に渡す（鍵配送）の問題がない", "SSL/TLSは公開鍵暗号だけで通信データ全体を暗号化している"], "a": 2, "e": "共通鍵暗号は鍵配送が課題。ハッシュは一方向で復元できない。デジタル署名は改ざん検知と本人確認のためで、秘匿はしない。TLSは鍵交換に公開鍵暗号、データ本体の暗号化には高速な共通鍵暗号を使う。"}, {"id": "R3-2-2", "y": "R3", "g": 2, "k": 2, "q": "論理式 A OR (A AND B) と等価な論理式はどれか。", "o": ["B", "A", "NOT A", "A AND B", "A OR B"], "a": 1, "e": "吸収則。Aが真なら全体は真、Aが偽なら A AND B も偽なので全体は偽。結局Aと同じ。真理値表を書くと確実。"}, {"id": "R3-2-3", "y": "R3", "g": 2, "k": 3, "q": "伝送時間＝データ量÷（回線速度×伝送効率）で求める。600 Mバイトのデータを100 Mbps、伝送効率80%の回線で送るときの伝送時間はどれか。", "o": ["48秒", "480秒", "60秒", "6秒", "75秒"], "a": 2, "e": "バイトをビットに直すのを忘れない。600 MB×8＝4800 Mbit。実効速度は100×0.8＝80 Mbps。4800÷80＝60秒。"}, {"id": "R3-2-4", "y": "R3", "g": 2, "k": 4, "q": "西暦年がうるう年かどうかは、「4で割り切れる年はうるう年。ただし100で割り切れる年は平年。ただし400で割り切れる年はうるう年」で判定する。うるう年はどれか。", "o": ["2200年", "2023年", "1900年", "2000年", "2100年"], "a": 3, "e": "2000年は400で割り切れるのでうるう年。1900・2100・2200年は100で割り切れるが400では割り切れないので平年。2023年は4で割り切れない。"}, {"id": "R3-2-5", "y": "R3", "g": 2, "k": 5, "q": "後置記法（逆ポーランド記法）の式 A B − C × D ＋ を中置記法で表したものはどれか。", "o": ["A−B×(C＋D)", "(A−B)×C＋D", "A−B×C＋D", "A−(B×C＋D)", "(A−B)×(C＋D)"], "a": 1, "e": "左から読み、演算子が来たら直前の2つに適用する。A B − → (A−B)、C × → (A−B)×C、D ＋ → (A−B)×C＋D。"}, {"id": "R3-2-6", "y": "R3", "g": 2, "k": 6, "q": "アルゴリズムの計算量（オーダ表記）に関する記述として、最も不適切なものはどれか。", "o": ["バブルソートの最悪計算量はO(n²)である", "ハッシュ表の探索は平均的にO(1)で行える", "O(n²)のアルゴリズムは、データ数が2倍になると処理時間もおよそ2倍になる", "マージソートの計算量はO(n log n)である", "線形探索の計算量はO(n)である"], "a": 2, "e": "O(n²)ではデータ数が2倍になると処理時間はおよそ2²＝4倍になる。"}, {"id": "R4-2-1", "y": "R4", "g": 2, "k": 1, "q": "テレワーク環境のセキュリティに関する記述として、最も不適切なものはどれか。", "o": ["私物端末を業務に使う場合は、組織のルールに従って管理する", "社外から社内システムに接続する場合、多要素認証は利便性を損なうため使わないほうが安全性は高まる", "人目のある場所では、画面ののぞき見に注意する", "OSやソフトウェアの更新を速やかに適用する", "公衆無線LANを使うときは、VPNなどで通信を暗号化する"], "a": 1, "e": "多要素認証はパスワード漏えい時の不正ログインを防ぐ有効な対策。社外からの接続ではむしろ導入が推奨される。"}, {"id": "R4-2-2", "y": "R4", "g": 2, "k": 2, "q": "100人の集団で、集合Aに属する人が50人、Bが40人、Cが30人、AかつBが20人、BかつCが10人、CかつAが15人、A・B・Cのいずれかに属する人が80人である。A・B・Cすべてに属する人は何人か。", "o": ["10人", "20人", "0人", "5人", "15人"], "a": 3, "e": "包含と排除の原理：|A∪B∪C|＝|A|＋|B|＋|C|−|A∩B|−|B∩C|−|C∩A|＋|A∩B∩C|。80＝120−45＋x より x＝5。"}, {"id": "R4-2-3", "y": "R4", "g": 2, "k": 3, "q": "主記憶に3ページまで格納でき、ページ置換方式にLRU（最も長く参照されていないページを追い出す）を使う。初めは空の状態で、ページを 1, 2, 3, 1, 4, 2, 5, 1 の順に参照したときのページフォールト（主記憶にないページの参照）の回数はどれか。", "o": ["5回", "8回", "7回", "4回", "6回"], "a": 2, "e": "1・2・3で3回。次の1はヒット。4で2を追い出し（4回目）、2で3を追い出し（5回目）、5で1を追い出し（6回目）、1で4を追い出し（7回目）。"}, {"id": "R4-2-4", "y": "R4", "g": 2, "k": 4, "q": "同じ長さの2つのビット列で、対応する位置の値が異なる個数をハミング距離という。10110 と 11011 のハミング距離はどれか。", "o": ["1", "4", "2", "3", "5"], "a": 3, "e": "1桁ずつ比べると、2・3・5桁目が異なるので3。2つの排他的論理和（01101）の1の個数を数えても同じ。"}, {"id": "R4-2-5", "y": "R4", "g": 2, "k": 5, "q": "2進数 1101.01 を10進数で表したものはどれか。", "o": ["13.01", "13.25", "11.25", "26.5", "13.5"], "a": 1, "e": "整数部 8＋4＋1＝13、小数部は 0×1/2＋1×1/4＝0.25。合計13.25。"}, {"id": "R4-2-6", "y": "R4", "g": 2, "k": 6, "q": "IPv4のネットワーク 192.168.10.0/26 で、ホストに割り当てられるアドレスの数はどれか。", "o": ["30", "254", "64", "126", "62"], "a": 4, "e": "/26はネットワーク部26ビット、ホスト部6ビット。2⁶＝64のうち、ホスト部がすべて0（ネットワークアドレス）とすべて1（ブロードキャスト）を除いて62。"}, {"id": "R5-2-1", "y": "R5", "g": 2, "k": 1, "q": "確率1/8で起こる事象が起きたことを知ったときに得られる情報量（自己情報量）はどれか。", "o": ["1ビット", "3ビット", "8ビット", "1/8ビット", "0.375ビット"], "a": 1, "e": "自己情報量は −log₂p。−log₂(1/8)＝3ビット。起こりにくい事象ほど情報量は大きい。"}, {"id": "R5-2-2", "y": "R5", "g": 2, "k": 2, "q": "ユークリッドの互除法を使って、252と105の最大公約数を求めた結果はどれか。", "o": ["63", "7", "14", "42", "21"], "a": 4, "e": "252＝2×105＋42、105＝2×42＋21、42＝2×21＋0。割り切れたときの割る数21が最大公約数。"}, {"id": "R5-2-3", "y": "R5", "g": 2, "k": 3, "q": "ISBN-13のチェックディジット（13桁目）は、先頭から12桁に左から重み1, 3, 1, 3, …を交互に掛けて合計し、その合計を10で割った余りを10から引いた値（10のときは0）である。先頭12桁が 978412345678 のとき、チェックディジットはどれか。", "o": ["8", "0", "4", "2", "6"], "a": 2, "e": "9＋21＋8＋12＋1＋6＋3＋12＋5＋18＋7＋24＝126。126を10で割った余りは6なので、10−6＝4。"}, {"id": "R5-2-4", "y": "R5", "g": 2, "k": 4, "q": "情報圧縮（データ圧縮）に関する記述として、最も不適切なものはどれか。", "o": ["非可逆圧縮では、圧縮後のデータから元のデータを完全に復元できる", "ランレングス圧縮は、同じ値が連続するデータに効果的である", "可逆圧縮では、圧縮したデータから元のデータを完全に復元できる", "ハフマン符号では、出現頻度の高い記号に短い符号を割り当てる", "JPEGは一般に非可逆圧縮の画像形式である"], "a": 0, "e": "非可逆圧縮は人が気づきにくい情報を捨てて圧縮率を上げる方式なので、元のデータには完全には戻らない。"}, {"id": "R5-2-5", "y": "R5", "g": 2, "k": 5, "q": "4ビット列 A＝1100、B＝1010 について、ビットごとの排他的論理和 A⊕B と論理積 A・B の組合せとして正しいものはどれか。", "o": ["A⊕B＝1000、A・B＝0110", "A⊕B＝1001、A・B＝1000", "A⊕B＝1110、A・B＝0110", "A⊕B＝0110、A・B＝1110", "A⊕B＝0110、A・B＝1000"], "a": 4, "e": "排他的論理和は値が異なる桁だけ1 → 0110。論理積は両方1の桁だけ1 → 1000。"}, {"id": "R5-2-6", "y": "R5", "g": 2, "k": 6, "q": "200人の集団で、Aに該当する人が120人、Bに該当する人が90人、AにもBにも該当しない人が30人いる。AとBの両方に該当する人は何人か。", "o": ["90人", "40人", "30人", "60人", "10人"], "a": 1, "e": "AまたはBに該当する人は200−30＝170人。120＋90−(両方)＝170 より、両方は40人。"}, {"id": "R6-2-1", "y": "R6", "g": 2, "k": 1, "q": "10進数の0.3を2進数で表したものとして、最も適切なものはどれか。", "o": ["0.0011（有限小数）", "0.011（有限小数）", "0.0100110011…（0011が循環する無限小数）", "0.1001100…（1001が循環）", "0.0101010…（01が循環）"], "a": 2, "e": "2を掛けて整数部を順に取る：0.3→0.6（0）→1.2（1）→0.4（0）→0.8（0）→1.6（1）→1.2（1）→…と0.2以降が繰り返す。0.3は2進数では有限桁で表せない。"}, {"id": "R6-2-2", "y": "R6", "g": 2, "k": 2, "q": "x、yを実数とする。「x＝0」は「xy＝0」であるための何条件か。", "o": ["十分条件であるが必要条件ではない", "必要十分条件", "必要条件であるが十分条件ではない", "必要条件でも十分条件でもない"], "a": 0, "e": "x＝0ならxy＝0は必ず成り立つ（十分）。逆にxy＝0でもy＝0の場合があり、x＝0とは限らない（必要ではない）。"}, {"id": "R6-2-3", "y": "R6", "g": 2, "k": 3, "q": "IPネットワークの経路制御に関する記述として、最も不適切なものはどれか。", "o": ["静的ルーティングでは、管理者が経路を手動で設定する", "動的ルーティングでは、ルーティングプロトコルによって経路情報が自動的に更新される", "デフォルトルートは、該当する経路がほかにないときに使われる", "ルータは宛先IPアドレスとルーティングテーブルをもとにパケットを転送する", "RIPはリンクステート型のプロトコルで、回線の帯域からコストを計算する"], "a": 4, "e": "RIPは距離ベクトル型で、経由するルータの数（ホップ数）で経路を選ぶ。リンクステート型で帯域などからコストを計算するのはOSPF。"}, {"id": "R6-2-4", "y": "R6", "g": 2, "k": 4, "q": "偶数パリティ方式（1の個数が偶数になるようにパリティビットを付ける）で送られた8ビットの受信データのうち、誤りが検出されるものはどれか。", "o": ["11111111", "00000000", "01110000", "11100001", "10110010"], "a": 2, "e": "1の個数を数えると、01110000だけが3個（奇数）で誤りと判定される。なお、2ビット同時に反転した誤りはパリティでは検出できない。"}, {"id": "R6-2-5", "y": "R6", "g": 2, "k": 5, "q": "拡張ユークリッド互除法を用いると、17x＋5y＝1 を満たす整数x、yを求められる。この式を満たす組はどれか。", "o": ["x＝4、y＝−13", "x＝−2、y＝7", "x＝2、y＝−7", "x＝−3、y＝10", "x＝1、y＝−3"], "a": 1, "e": "代入して確かめる。17×(−2)＋5×7＝−34＋35＝1。ほかは2、−1、−1、3となり成り立たない。"}, {"id": "R6-2-6", "y": "R6", "g": 2, "k": 6, "q": "暗号技術に関する記述として、最も不適切なものはどれか。", "o": ["AESは共通鍵暗号方式の代表的な規格である", "電子証明書は認証局（CA）が発行し、公開鍵の持ち主を証明する", "SHA-256はハッシュ関数の一つである", "RSAは、大きな数の素因数分解が難しいことを安全性の根拠としている", "共通鍵暗号方式は、公開鍵暗号方式に比べて一般に処理が遅い"], "a": 4, "e": "共通鍵暗号は計算が軽く高速。公開鍵暗号のほうが処理が重いため、実際には両者を組み合わせて使う。"}, {"id": "R7-2-1", "y": "R7", "g": 2, "k": 1, "q": "集合A＝{a, b}、B＝{p, q}、C＝{x, y, z} とする。直積集合A×BからCへの写像は全部で何通りあるか。", "o": ["12通り", "81通り", "24通り", "7通り", "64通り"], "a": 1, "e": "A×Bの要素は2×2＝4個。各要素の行き先がCの3通りずつあるので 3⁴＝81通り。"}, {"id": "R7-2-2", "y": "R7", "g": 2, "k": 2, "q": "情報理論に関する記述として、最も不適切なものはどれか。", "o": ["起こる確率の高い事象ほど、自己情報量は大きい", "確率pの事象の自己情報量は −log₂p で表される", "通信路には、誤りなく送れる情報量の上限（通信路容量）がある", "情報源のエントロピーは、すべての記号が等確率で出るときに最大となる", "平均符号長は、情報源のエントロピーより短くすることはできない"], "a": 0, "e": "自己情報量は起こりにくい（確率の低い）事象ほど大きい。確率1の事象の情報量は0。"}, {"id": "R7-2-3", "y": "R7", "g": 2, "k": 3, "q": "TCPのふくそう制御に関する記述として、最も不適切なものはどれか。", "o": ["TCPはコネクションレス型のプロトコルで、再送制御は行わない", "パケット損失を検知すると、ウィンドウを小さくする", "重複したACKを3回受け取ると、タイムアウトを待たずに再送する（高速再送）", "スロースタートでは、ふくそうウィンドウを指数関数的に増やす", "ふくそう回避の段階では、ウィンドウを線形に増やす"], "a": 0, "e": "TCPはコネクション型で、確認応答と再送で信頼性を確保する。コネクションレス型で再送しないのはUDP。"}, {"id": "R7-2-4", "y": "R7", "g": 2, "k": 4, "q": "標的型攻撃への対策として、最も不適切なものはどれか。", "o": ["メールの添付ファイルの実行を制限する", "外部の不審なサーバへの通信を監視・遮断する（出口対策）", "不審なメールを見分ける訓練を従業員に行う", "感染した端末を見つけたら、証拠を残すためネットワークに接続したまま使い続ける", "入口・内部・出口の多層で防御する"], "a": 3, "e": "感染端末はまずネットワークから切り離し、被害の拡大を防ぐ。証拠保全は電源を切らずに隔離するなどの方法で行う。"}, {"id": "R7-2-5", "y": "R7", "g": 2, "k": 5, "q": "伝送時間＝データ量÷（回線速度×伝送効率）で求める。1.5 Gバイトのデータを1 Gbps、伝送効率60%の回線で送るときの伝送時間はどれか。", "o": ["1.5秒", "200秒", "20秒", "25秒", "12秒"], "a": 2, "e": "1.5 GB×8＝12 Gbit。実効速度は1×0.6＝0.6 Gbps。12÷0.6＝20秒。"}, {"id": "R7-2-6", "y": "R7", "g": 2, "k": 6, "q": "関数Aを A(0, n)＝n＋1、A(m, 0)＝A(m−1, 1)、A(m, n)＝A(m−1, A(m, n−1)) で定義する（アッカーマン関数）。A(1, 3)の値はどれか。", "o": ["3", "6", "5", "7", "4"], "a": 2, "e": "A(1,0)＝A(0,1)＝2、A(1,1)＝A(0,A(1,0))＝A(0,2)＝3、A(1,2)＝A(0,3)＝4、A(1,3)＝A(0,4)＝5。一般にA(1,n)＝n＋2。"}, {"id": "R3-3-1", "y": "R3", "g": 3, "k": 1, "q": "3次元直交座標系で、ベクトル場 v＝(x², xy, z) の発散 div v の点(1, 2, 3)における値はどれか。", "o": ["4", "3", "2", "6", "1"], "a": 0, "e": "div v＝∂(x²)/∂x＋∂(xy)/∂y＋∂z/∂z＝2x＋x＋1。点(1,2,3)では 2＋1＋1＝4。"}, {"id": "R3-3-2", "y": "R3", "g": 3, "k": 2, "q": "定積分 ∫₀² (x³＋1) dx を、シンプソンの1/3公式（刻み幅h＝1、1区間）で近似した値はどれか。", "o": ["4", "8", "7", "6", "5"], "a": 3, "e": "(h/3)×{f(0)＋4f(1)＋f(2)}＝(1/3)×(1＋8＋9)＝6。厳密値も x⁴/4＋x に代入して4＋2＝6。シンプソン公式は3次式まで誤差なく積分できる。"}, {"id": "R3-3-3", "y": "R3", "g": 3, "k": 3, "q": "線形弾性体の2次元有限要素解析で用いる要素のうち、要素内でひずみが一定となるものはどれか。", "o": ["6節点三角形要素", "9節点四辺形要素", "3節点三角形要素", "8節点四辺形要素", "4節点四辺形要素"], "a": 2, "e": "3節点三角形要素は変位が1次式で表されるため、その微分であるひずみは要素内で一定（定ひずみ三角形要素）。応力集中部では細かく分割する必要がある。"}, {"id": "R3-3-4", "y": "R3", "g": 3, "k": 4, "q": "両端を剛体壁に固定した棒（ヤング率200 GPa、線膨張係数1.0×10⁻⁵ /K）の温度を50 K上げた。棒に生じる熱応力の大きさはどれか。", "o": ["100 MPa（圧縮）", "1000 MPa（圧縮）", "10 MPa（圧縮）", "50 MPa（引張）", "200 MPa（引張）"], "a": 0, "e": "自由なら伸びるはずのひずみ αΔT＝5×10⁻⁴ が拘束されるので、σ＝EαΔT＝200×10³ MPa×5×10⁻⁴＝100 MPa。伸びを押さえ込まれるので圧縮。棒の長さや断面積には関係しない。"}, {"id": "R3-3-5", "y": "R3", "g": 3, "k": 5, "q": "ばねに質量mのおもりをつり下げたところ、静的に10 mm伸びてつり合った。この系の固有角振動数に最も近い値はどれか（重力加速度9.8 m/s²）。", "o": ["98 rad/s", "9.9 rad/s", "980 rad/s", "3.1 rad/s", "31.3 rad/s"], "a": 4, "e": "つり合いより k＝mg/δ。ω＝√(k/m)＝√(g/δ)＝√(9.8/0.01)＝√980≒31.3 rad/s。"}, {"id": "R3-3-6", "y": "R3", "g": 3, "k": 6, "q": "厚さが一定で一様な半径aの半円板がある。直径をx軸上に、中心を原点に置いたとき、重心のy座標はどれか。", "o": ["a/2", "4a/(3π)", "2a/π", "3a/8", "a/π"], "a": 1, "e": "半円板の重心は中心から 4a/(3π)（約0.42a）。四分円板の場合はx、yとも 4a/(3π) となる。"}, {"id": "R4-3-1", "y": "R4", "g": 3, "k": 1, "q": "格子点iの間隔をhとする。2階導関数 d²f/dx² の中心差分表現として正しいものはどれか。", "o": ["(f[i+1]−2f[i]＋f[i−1])/(2h)", "(f[i+1]−2f[i]＋f[i−1])/h²", "(f[i+1]−f[i−1])/(2h)", "(f[i+1]−f[i])/h", "(f[i+1]＋2f[i]＋f[i−1])/h²"], "a": 1, "e": "前進差分と後退差分の差をさらにhで割ると (f[i+1]−2f[i]＋f[i−1])/h²。(f[i+1]−f[i−1])/(2h) は1階導関数の中心差分。"}, {"id": "R4-3-2", "y": "R4", "g": 3, "k": 2, "q": "3次元の任意のベクトルa、bについて、必ずしも成り立たないものはどれか。", "o": ["a・b＝b・a", "|a×b|²＋(a・b)²＝|a|²|b|²", "a・(a×b)＝0", "a×b＝b×a", "a×b＝−(b×a)"], "a": 3, "e": "外積は順序を入れ替えると符号が反転する（a×b＝−b×a）。a×bはaにもbにも垂直なので a・(a×b)＝0。"}, {"id": "R4-3-3", "y": "R4", "g": 3, "k": 3, "q": "数値解析の精度を向上させる方法として、最も不適切なものはどれか。", "o": ["単精度の代わりに倍精度の浮動小数点数を用いる", "応力が集中する部分の要素分割を細かくする", "陽解法の計算が発散したので、時間刻み幅をより大きくする", "解の収束状況を、分割数を変えて確認する", "より高次の要素や近似式を用いる"], "a": 2, "e": "陽解法では時間刻みが大きすぎると不安定になって発散する。安定のためには刻み幅を小さくする。"}, {"id": "R4-3-4", "y": "R4", "g": 3, "k": 4, "q": "天井から左右対称に張られた2本の棒が、それぞれ鉛直と30°の角度をなして点Cで結合され、点Cに鉛直下向きの荷重Pが作用している。1本の棒に生じる軸力の大きさはどれか。", "o": ["P/√3", "P/2", "(√3/2)P", "2P", "P"], "a": 0, "e": "鉛直方向のつり合い：2Ncos30°＝P より N＝P/(2×√3/2)＝P/√3（約0.58P、引張）。"}, {"id": "R4-3-5", "y": "R4", "g": 3, "k": 5, "q": "慣性モーメント0.5 kg·m²の円盤を、静止状態から5秒間で角速度100 rad/sまで一定の角加速度で加速したい。必要なトルクはどれか（摩擦は無視）。", "o": ["2.5 N·m", "500 N·m", "250 N·m", "10 N·m", "50 N·m"], "a": 3, "e": "角加速度 α＝100/5＝20 rad/s²。T＝Iα＝0.5×20＝10 N·m。"}, {"id": "R4-3-6", "y": "R4", "g": 3, "k": 6, "q": "張力Tで上下に張られた長さ2Lの糸の中央に質量mの物体が取り付けられている。物体が糸と直角方向に小さく振動するときの固有角振動数はどれか（重力と糸の質量は無視）。", "o": ["√(4T/(mL))", "√(mL/T)", "√(2T/(mL))", "√(T/(mL))", "√(T/(2mL))"], "a": 2, "e": "物体がx変位すると、上下の糸の張力の横方向成分がそれぞれ T×x/L で戻そうとする。復元力 2Tx/L から等価ばね定数 2T/L、ω＝√(2T/(mL))。"}, {"id": "R5-3-1", "y": "R5", "g": 3, "k": 1, "q": "行列 [[2, 1], [5, 3]]（1行目が2, 1、2行目が5, 3）の逆行列はどれか。", "o": ["[[2, −1], [−5, 3]]", "[[3, 1], [5, 2]]", "[[3, −1], [−5, 2]]", "[[3, −5], [−1, 2]]", "[[−3, 1], [5, −2]]"], "a": 2, "e": "行列式は 2×3−1×5＝1。2×2行列 [[a,b],[c,d]] の逆行列は (1/(ad−bc))×[[d,−b],[−c,a]] なので [[3,−1],[−5,2]]。"}, {"id": "R5-3-2", "y": "R5", "g": 3, "k": 2, "q": "領域Rを 0≦x≦1、0≦y≦√(1−x²)（単位円の第1象限部分）とするとき、重積分 ∬_R x dxdy の値はどれか。", "o": ["1/6", "π/8", "1/4", "1/3", "π/4"], "a": 3, "e": "yで先に積分すると ∫₀¹ x√(1−x²) dx。t＝1−x² と置くと (1/2)∫₀¹ √t dt＝(1/2)×(2/3)＝1/3。"}, {"id": "R5-3-3", "y": "R5", "g": 3, "k": 3, "q": "数値解析に関する記述として、最も不適切なものはどれか。", "o": ["台形公式は、2次関数までの積分を誤差なく計算できる", "ニュートン法は、解の近くでは2次収束する", "オイラー法は1次精度の解法である", "古典的ルンゲ・クッタ法は4次精度の解法である", "二分法は収束は遅いが、条件を満たせば確実に解に近づく"], "a": 0, "e": "台形公式が誤差なく積分できるのは1次関数まで。シンプソンの1/3公式は3次関数まで誤差なく計算できる。"}, {"id": "R5-3-4", "y": "R5", "g": 3, "k": 4, "q": "長さ2.0 m、断面積1.0×10² mm²、ヤング率200 GPaの棒の下端を1.0 kNで引っ張った。棒の伸びはどれか。", "o": ["0.5 mm", "0.1 mm", "1 mm", "0.01 mm", "10 mm"], "a": 1, "e": "δ＝PL/(AE)＝1000 N×2000 mm÷(100 mm²×200000 N/mm²)＝0.1 mm。単位をN・mmにそろえるのがコツ。"}, {"id": "R5-3-5", "y": "R5", "g": 3, "k": 5, "q": "損失のない変速機（減速比5）を介して、慣性モーメント50 kg·m²の負荷をモータで回す。モータ軸から見た負荷の慣性モーメント（換算値）はどれか。", "o": ["10 kg·m²", "0.4 kg·m²", "2 kg·m²", "1250 kg·m²", "250 kg·m²"], "a": 2, "e": "負荷側の慣性モーメントは、減速比の2乗で割ってモータ軸に換算する。50÷5²＝2 kg·m²。"}, {"id": "R5-3-6", "y": "R5", "g": 3, "k": 6, "q": "抵抗rの導線4本で正方形の回路を作った。対角にある2つの頂点の間の合成抵抗はどれか。", "o": ["r/4", "4r", "2r", "r", "r/2"], "a": 3, "e": "対角の頂点間には2rの経路が2本並列にあるので 2r∥2r＝r。"}, {"id": "R6-3-1", "y": "R6", "g": 3, "k": 1, "q": "u＝f²＋g、f＝x＋y、g＝xy のとき、点(x, y)＝(1, 2)における ∂u/∂x の値はどれか。", "o": ["8", "10", "6", "3", "5"], "a": 0, "e": "連鎖律より ∂u/∂x＝(∂u/∂f)(∂f/∂x)＋(∂u/∂g)(∂g/∂x)＝2f×1＋1×y。f＝3、y＝2 を入れて 6＋2＝8。"}, {"id": "R6-3-2", "y": "R6", "g": 3, "k": 2, "q": "ベクトル a＝(3, 4, 0) と、大きさ1のベクトル b＝(0, 0.6, 0.8) がある。aのb方向への正射影の長さ（a・b）はどれか。", "o": ["5.0", "2.4", "1.8", "3.0", "4.4"], "a": 1, "e": "|b|＝1なので射影の長さは内積そのもの。a・b＝0＋2.4＋0＝2.4。"}, {"id": "R6-3-3", "y": "R6", "g": 3, "k": 3, "q": "ニュートン・ラフソン法 x(n+1)＝x(n)−f(x(n))/f′(x(n)) で f(x)＝x²−2 の正の解を求める。初期値x(0)＝1のとき、x(2)の値に最も近いものはどれか。", "o": ["1.4167", "1.4142", "1.25", "1.75", "1.5"], "a": 0, "e": "f′(x)＝2x。x(1)＝1−(−1)/2＝1.5、x(2)＝1.5−0.25/3＝17/12≒1.4167。2回で√2＝1.4142…にかなり近づく。"}, {"id": "R6-3-4", "y": "R6", "g": 3, "k": 4, "q": "材料・断面・長さが同じ柱を、次の支持条件で軸圧縮する。オイラーの座屈荷重が最も大きいものはどれか。", "o": ["いずれも同じ", "一端固定・他端自由", "両端固定", "両端回転自由（ピン）", "一端固定・他端回転自由"], "a": 2, "e": "座屈荷重は有効座屈長さの2乗に反比例する。有効長さは一端固定他端自由2L、両端ピンL、固定−ピン約0.7L、両端固定0.5Lで、両端固定が最も大きい。"}, {"id": "R6-3-5", "y": "R6", "g": 3, "k": 5, "q": "ばね定数kの同じばね2本と質量mの質点で、ばねを並列にした系と直列にした系を作った。並列の系の固有振動数は直列の系の何倍か。", "o": ["1倍", "2倍", "4倍", "1/2倍", "√2倍"], "a": 1, "e": "並列の合成ばね定数は2k、直列はk/2。固有振動数は√(ばね定数)に比例するので √(2k÷(k/2))＝√4＝2倍。"}, {"id": "R6-3-6", "y": "R6", "g": 3, "k": 6, "q": "1 Ωの抵抗を2個並列にしたものに、1 Ωの抵抗1個を直列に接続した。全体の合成抵抗はどれか。", "o": ["0.33 Ω", "0.67 Ω", "3 Ω", "1.5 Ω", "2 Ω"], "a": 3, "e": "並列部分は 1×1/(1＋1)＝0.5 Ω。直列に1 Ωを足して1.5 Ω。"}, {"id": "R7-3-1", "y": "R7", "g": 3, "k": 1, "q": "αを0でない実数とする。行列 [[1, α], [0, 1]] の逆行列はどれか。", "o": ["[[1, 0], [−α, 1]]", "[[1, 1/α], [0, 1]]", "[[−1, α], [0, −1]]", "[[1, α], [0, 1]]", "[[1, −α], [0, 1]]"], "a": 4, "e": "行列式は1。公式で [[1, −α], [0, 1]]。元の行列と掛けると単位行列になることで確かめられる。"}, {"id": "R7-3-2", "y": "R7", "g": 3, "k": 2, "q": "関数 f(x, y)＝x²＋3xy の点(1, 2)における勾配ベクトルの大きさ ‖grad f‖ はどれか。", "o": ["73", "√11", "11", "√73", "√65"], "a": 3, "e": "∂f/∂x＝2x＋3y＝8、∂f/∂y＝3x＝3。‖grad f‖＝√(8²＋3²)＝√73（約8.5）。"}, {"id": "R7-3-3", "y": "R7", "g": 3, "k": 3, "q": "関数y＝f(x)が f(0)＝1、f(1)＝3、f(2)＝7 を満たす。区間[0, 2]の定積分をシンプソンの1/3公式（h＝1）で近似した値はどれか。", "o": ["5.0", "7.0", "6.67", "6.0", "11.0"], "a": 2, "e": "(h/3)×{f(0)＋4f(1)＋f(2)}＝(1/3)×(1＋12＋7)＝20/3≒6.67。"}, {"id": "R7-3-4", "y": "R7", "g": 3, "k": 4, "q": "長さLの一様な棒の両端が固定されている。左端からL/3の位置に、棒の軸方向（右向き）に30 kNの荷重を加えた。左端の固定壁が受ける反力の大きさはどれか。", "o": ["25 kN", "30 kN", "20 kN", "15 kN", "10 kN"], "a": 2, "e": "荷重点の左側は引張、右側は圧縮となり、左側の伸びと右側の縮みが等しい条件から、荷重点に近い壁ほど大きな反力を受ける。左端は 30×(2L/3)/L＝20 kN、右端は 30×(L/3)/L＝10 kN。"}, {"id": "R7-3-5", "y": "R7", "g": 3, "k": 5, "q": "抵抗Rの導線6本を辺とする正四面体の回路がある。2つの頂点の間の合成抵抗はどれか。", "o": ["R/3", "2R/3", "R", "R/4", "R/2"], "a": 4, "e": "対称性から残り2頂点は同電位で、その間の辺には電流が流れない。直接の辺R、他の頂点を経由する2Rの経路2本が並列で、R∥2R∥2R＝R∥R＝R/2。"}, {"id": "R7-3-6", "y": "R7", "g": 3, "k": 6, "q": "間隔0.4 mで平行に張られた2本の導線の一端に2 Ωの抵抗をつなぎ、その上に導体棒を渡す。磁束密度0.5 Tの一様な磁界が回路面に垂直にかかっており、導体棒を10 m/sで動かすとき、回路に流れる電流はどれか（導線と棒の抵抗は無視）。", "o": ["1 A", "2 A", "4 A", "0.5 A", "0.1 A"], "a": 0, "e": "誘導起電力 V＝BLv＝0.5×0.4×10＝2 V。I＝V/R＝1 A。棒にはBIL＝0.2 Nの力が運動を妨げる向きに働く。"}, {"id": "R3-4-1", "y": "R3", "g": 4, "k": 1, "q": "同位体に関する記述として、最も不適切なものはどれか。", "o": ["同位体どうしは陽子の数が同じで、中性子の数が異なる", "同位体どうしは原子番号が異なる", "同位体どうしは質量数が異なる", "同位体どうしの化学的性質はほぼ同じである", "放射性同位体は医療診断や年代測定に利用される"], "a": 1, "e": "原子番号＝陽子の数なので、同位体どうしの原子番号は同じ。違うのは中性子の数（つまり質量数）。"}, {"id": "R3-4-2", "y": "R3", "g": 4, "k": 2, "q": "次の化学反応のうち、酸化還元反応でないものはどれか。", "o": ["2Mg＋O₂ → 2MgO", "2H₂＋O₂ → 2H₂O", "NaOH＋HCl → NaCl＋H₂O", "Zn＋2HCl → ZnCl₂＋H₂", "CuO＋H₂ → Cu＋H₂O"], "a": 2, "e": "NaOHとHClの反応は中和反応で、どの原子の酸化数も変化しない。ほかは単体が関わっていて酸化数が変化する。「単体が出入りする反応は酸化還元」は判断の目安になる。"}, {"id": "R3-4-3", "y": "R3", "g": 4, "k": 3, "q": "金属の変形に関する記述として、最も不適切なものはどれか。", "o": ["加工硬化は、変形によって転位が増え、互いに動きにくくなることで起こる", "結晶粒を細かくすると、一般に金属の強度は低下する", "面心立方構造の金属は一般に延性に富む", "焼なましを行うと、加工硬化した金属を軟らかくできる", "金属の塑性変形は、主に転位が移動することで生じる"], "a": 1, "e": "結晶粒界は転位の移動を妨げるため、結晶粒を細かくすると強度は上がる（ホール・ペッチの関係）。"}, {"id": "R3-4-4", "y": "R3", "g": 4, "k": 4, "q": "鉄の製錬に関する記述として、最も不適切なものはどれか。", "o": ["電気炉では鉄スクラップを主な原料にできる", "転炉では酸素を吹き込んで、銑鉄中の炭素を減らして鋼にする", "高炉で得られる銑鉄は炭素を約4%含み、硬くてもろい", "高炉では、コークスから生じた一酸化炭素が酸化鉄を還元する", "高炉では、鉄鉱石を酸化して鉄を取り出す"], "a": 4, "e": "鉄鉱石は酸化鉄なので、取り出すには酸素を奪う「還元」が必要。高炉は還元、転炉は余分な炭素を酸化して除く工程。"}, {"id": "R3-4-5", "y": "R3", "g": 4, "k": 5, "q": "タンパク質を構成するアミノ酸に関する記述として、最も不適切なものはどれか。", "o": ["生物のタンパク質を構成するアミノ酸は、ほとんどがD型である", "グリシン以外は鏡像異性体（L型とD型）が存在する", "同じ炭素原子にアミノ基とカルボキシ基が結合している", "アミノ酸どうしはペプチド結合でつながる", "側鎖の違いによって、アミノ酸の性質が決まる"], "a": 0, "e": "生物のタンパク質を構成するアミノ酸は、ほとんどがL型。グリシンは不斉炭素をもたないため鏡像異性体がない。"}, {"id": "R3-4-6", "y": "R3", "g": 4, "k": 6, "q": "DNAの1塩基が挿入または欠失したために、それ以降のコドンの読み枠がずれて、アミノ酸配列が大きく変わる突然変異はどれか。", "o": ["ナンセンス変異", "フレームシフト変異", "ミスセンス変異", "逆位", "サイレント変異"], "a": 1, "e": "サイレントはアミノ酸が変わらない置換、ミスセンスは別のアミノ酸に変わる置換、ナンセンスは終止コドンに変わる置換。挿入・欠失で読み枠がずれるのがフレームシフト。"}, {"id": "R4-4-1", "y": "R4", "g": 4, "k": 1, "q": "常温・常圧での物質の性質に関する記述として、最も不適切なものはどれか。", "o": ["ヘリウムは単原子分子の気体である", "水銀は液体である", "ダイヤモンドは電気をほとんど通さない", "塩化ナトリウムの固体は電気をよく通す", "臭素は液体である"], "a": 3, "e": "イオン結晶は固体ではイオンが動けないため電気を通さない。融解したり水に溶かしたりすると通す。"}, {"id": "R4-4-2", "y": "R4", "g": 4, "k": 2, "q": "次の物質のうち、硫黄（S）原子の酸化数が最も小さいものはどれか。", "o": ["H₂SO₄", "H₂S", "S（単体）", "Na₂S₂O₃", "SO₂"], "a": 1, "e": "Hを＋1、Oを−2、Naを＋1として計算すると、H₂Sは−2、SO₂は＋4、H₂SO₄は＋6、単体は0、Na₂S₂O₃は＋2。"}, {"id": "R4-4-3", "y": "R4", "g": 4, "k": 3, "q": "ステンレス鋼に関する次の記述の（ア）（イ）に入る語句の組合せとして、最も適切なものはどれか。\nクロム約18%、ニッケル約8%を含むオーステナイト系ステンレス鋼の代表は（ア）であり、通常の状態では磁性を（イ）。", "o": ["ア SUS304　イ 強く示す", "ア SUS430　イ 示さない", "ア SUS304　イ 示さない", "ア SUS430　イ 強く示す", "ア SS400　イ 示さない"], "a": 2, "e": "SUS304はオーステナイト系で通常は非磁性（加工すると弱い磁性が出ることがある）。SUS430はクロム系（フェライト系）で磁性をもつ。SS400は一般構造用圧延鋼材。"}, {"id": "R4-4-4", "y": "R4", "g": 4, "k": 4, "q": "材料試験と、主に評価する特性の組合せとして、最も不適切なものはどれか。", "o": ["クリープ試験：常温で瞬間的に破断するときの強さ", "疲労試験：S-N曲線（疲労限度）", "ビッカース試験：硬さ", "シャルピー衝撃試験：靱性（衝撃吸収エネルギー）", "引張試験：引張強さ、伸び"], "a": 0, "e": "クリープ試験は、主に高温で一定荷重を長時間かけたときの、時間とともに進む変形や破断を調べる試験。"}, {"id": "R4-4-5", "y": "R4", "g": 4, "k": 5, "q": "酵素に関する記述として、最も適切なものはどれか。", "o": ["酵素は化学反応の平衡定数を大きく変える", "1種類の酵素は、どのような化学反応にも作用する", "温度を上げるほど、酵素の活性は限りなく高くなる", "酵素は主に脂質からできている", "基質濃度を高くすると反応速度は大きくなるが、やがて一定の最大値に近づく"], "a": 4, "e": "酵素が基質で飽和すると速度は頭打ちになる（ミカエリス・メンテン式）。酵素には基質特異性があり、最適温度を超えると失活する。触媒なので平衡は変えず、主成分はタンパク質。"}, {"id": "R4-4-6", "y": "R4", "g": 4, "k": 6, "q": "二本鎖DNAの一方の鎖の塩基組成が、グアニン（G）20%、アデニン（A）30%、シトシン（C）15%、チミン（T）35%であった。もう一方の鎖（相補鎖）のアデニンの割合はどれか。", "o": ["35%", "30%", "20%", "50%", "15%"], "a": 0, "e": "相補鎖のAは、元の鎖のTと対をなす。元の鎖のTが35%なので相補鎖のAも35%。"}, {"id": "R5-4-1", "y": "R5", "g": 4, "k": 1, "q": "電荷のない状態の原子に関する記述として、最も適切なものはどれか。", "o": ["電子の質量は陽子の質量とほぼ等しい", "中性子は負の電荷をもつ", "同じ族の元素は、最外殻電子の数がそれぞれ異なる", "質量数は陽子の数と電子の数の和である", "原子番号は陽子の数に等しい"], "a": 4, "e": "質量数＝陽子数＋中性子数。電子の質量は陽子の約1/1840。同族元素は最外殻電子数が同じで性質が似る。中性子は電荷をもたない。"}, {"id": "R5-4-2", "y": "R5", "g": 4, "k": 2, "q": "コロイドに関する記述として、最も不適切なものはどれか。", "o": ["コロイド粒子は不規則な運動（ブラウン運動）をする", "コロイド溶液に光を当てると光の通り道が見える（チンダル現象）", "電圧をかけるとコロイド粒子が一方の電極へ移動する（電気泳動）", "疎水コロイドに少量の電解質を加えても、沈殿（凝析）は起こらない", "半透膜を使ってコロイド溶液から小さな分子やイオンを除ける（透析）"], "a": 3, "e": "疎水コロイドは少量の電解質で電荷が打ち消されて沈殿する（凝析）。多量の電解質で沈殿するのは親水コロイド（塩析）。"}, {"id": "R5-4-3", "y": "R5", "g": 4, "k": 3, "q": "常温における金属とその結晶構造の組合せとして、最も不適切なものはどれか。", "o": ["鉄：体心立方", "銅：体心立方", "チタン：六方最密", "マグネシウム：六方最密", "アルミニウム：面心立方"], "a": 1, "e": "銅は面心立方。常温の鉄（α鉄）は体心立方で、約912℃以上で面心立方（γ鉄）に変わる。"}, {"id": "R5-4-4", "y": "R5", "g": 4, "k": 4, "q": "金属材料の腐食に関する記述として、適切なものはどれか。", "o": ["アルミニウム表面の酸化皮膜は腐食を促進する", "ステンレス鋼は塩化物イオンを含む環境でも孔食を起こさない", "異なる金属を接触させて電解質中に置くと、イオン化傾向の大きい金属が腐食されやすい", "乾燥した空気中のほうが、湿った空気中より鉄はさびやすい", "鋼板に亜鉛めっきをすると、傷がついたとき鉄が亜鉛より先に腐食する"], "a": 2, "e": "異種金属接触腐食（ガルバニック腐食）。亜鉛めっきは亜鉛が先に溶けて鉄を守る（犠牲防食）。ステンレス鋼も塩化物で孔食することがある。"}, {"id": "R5-4-5", "y": "R5", "g": 4, "k": 5, "q": "タンパク質の高次構造のうち、αヘリックスやβシートはどれに当たるか。", "o": ["二次構造", "ドメイン構造", "四次構造", "一次構造", "三次構造"], "a": 0, "e": "一次構造はアミノ酸の配列、二次構造は水素結合によるαヘリックスやβシート、三次構造は1本の鎖全体の立体構造、四次構造は複数の鎖（サブユニット）の集合。"}, {"id": "R5-4-6", "y": "R5", "g": 4, "k": 6, "q": "PCR（ポリメラーゼ連鎖反応）法の1サイクルの工程の順として、最も適切なものはどれか。", "o": ["アニーリング → 伸長 → 熱変性", "熱変性（約95℃）→ アニーリング（約55℃）→ 伸長（約72℃）", "熱変性 → 伸長 → アニーリング", "伸長 → 熱変性 → アニーリング", "アニーリング → 熱変性 → 伸長"], "a": 1, "e": "高温で2本鎖をほどき、温度を下げてプライマーを結合させ、耐熱性DNAポリメラーゼで伸長する。理想的にはnサイクルで2ⁿ倍に増える。"}, {"id": "R6-4-1", "y": "R6", "g": 4, "k": 1, "q": "ハロゲンに関する記述として、最も不適切なものはどれか。", "o": ["フッ素はハロゲンの中で最も酸化力が強い", "塩素は常温で黄緑色の気体である", "ハロゲン化水素の水溶液はすべて強酸である", "臭素は常温で赤褐色の液体である", "ヨウ素は常温で黒紫色の固体で、昇華性がある"], "a": 2, "e": "フッ化水素酸（HFの水溶液）は弱酸。HCl、HBr、HIの水溶液は強酸。"}, {"id": "R6-4-2", "y": "R6", "g": 4, "k": 2, "q": "2価の多原子イオンを含む化合物として、最も適切なものはどれか。", "o": ["MgCl₂", "Na₂SO₄", "NH₄Cl", "NaNO₃"], "a": 1, "e": "Na₂SO₄は硫酸イオンSO₄²⁻（2価の多原子イオン）を含む。NO₃⁻とNH₄⁺は1価、MgCl₂のMg²⁺は2価だが単原子イオン。"}, {"id": "R6-4-3", "y": "R6", "g": 4, "k": 3, "q": "面心立方構造の単位格子に含まれる原子の数と配位数の組合せとして、正しいものはどれか。", "o": ["原子数6、配位数12", "原子数2、配位数12", "原子数4、配位数8", "原子数4、配位数12", "原子数2、配位数8"], "a": 3, "e": "面心立方：頂点 1/8×8＋面心 1/2×6＝4個、配位数12（充填率約74%）。体心立方：1/8×8＋1＝2個、配位数8（約68%）。"}, {"id": "R6-4-4", "y": "R6", "g": 4, "k": 4, "q": "材料に関する記述として、最も不適切なものはどれか。", "o": ["セラミックスは一般に耐熱性が高いが、もろい", "アルミニウムの融点は鉄より高い", "熱硬化性樹脂は一度硬化すると、再び加熱しても軟らかくならない", "熱可塑性樹脂は加熱すると軟らかくなり、再び成形できる", "ガラスは原子の並びが不規則な非晶質（アモルファス）である"], "a": 1, "e": "融点はアルミニウム約660℃、鉄約1538℃で、鉄のほうがはるかに高い。"}, {"id": "R6-4-5", "y": "R6", "g": 4, "k": 5, "q": "DNAに関する記述として、最も不適切なものはどれか。", "o": ["DNAの塩基はアデニン、グアニン、シトシン、チミンの4種類である", "DNAを構成する糖はデオキシリボースである", "遺伝情報は塩基の並び順として記録されている", "DNAは2本の鎖からなる二重らせん構造をとる", "DNAの2本の鎖は同じ向き（平行）に並んでいる"], "a": 4, "e": "DNAの2本鎖は互いに逆向き（逆平行）に並んでいる。"}, {"id": "R6-4-6", "y": "R6", "g": 4, "k": 6, "q": "タンパク質の性質に関する記述として、最も適切なものはどれか。", "o": ["すべてのタンパク質は酵素としての働きをもつ", "タンパク質はヌクレオチドが多数つながった高分子である", "変性すると、アミノ酸どうしのペプチド結合が必ず切断される", "タンパク質を構成する20種類のアミノ酸は、すべてヒトの体内で合成できる", "加熱や強い酸などで立体構造が変わり、機能を失うことを変性という"], "a": 4, "e": "タンパク質はアミノ酸の重合体（ヌクレオチドの重合体は核酸）。変性は主に立体構造が壊れることで、一次構造は通常保たれる。体内で合成できない必須アミノ酸がある。"}, {"id": "R7-4-1", "y": "R7", "g": 4, "k": 1, "q": "次の物質のうち、窒素（N）原子の酸化数が最も大きいものはどれか。", "o": ["NO", "HNO₃", "N₂", "NO₂", "NH₃"], "a": 1, "e": "NH₃は−3、N₂は0、NOは＋2、NO₂は＋4、HNO₃は＋5。"}, {"id": "R7-4-2", "y": "R7", "g": 4, "k": 2, "q": "次の物質の希薄水溶液のうち、酸として最も弱いものはどれか。", "o": ["臭化水素（HBr）", "塩化水素（HCl）", "酢酸（CH₃COOH）", "硫酸（H₂SO₄）", "硝酸（HNO₃）"], "a": 2, "e": "酢酸は水溶液中でわずかしか電離しない弱酸。ほかは強酸。"}, {"id": "R7-4-3", "y": "R7", "g": 4, "k": 3, "q": "金属材料に関する記述として、最も不適切なものはどれか。", "o": ["黄銅は銅とスズの合金である", "鋼を高温から急冷する焼入れで、硬いマルテンサイト組織が得られる", "銅は電気伝導率が高く、電線に使われる", "チタンは比強度が大きく、耐食性にも優れる", "鋼は炭素量が増えると一般に硬くなるが、もろくなる"], "a": 0, "e": "黄銅（真ちゅう）は銅と亜鉛の合金。銅とスズの合金は青銅。"}, {"id": "R7-4-4", "y": "R7", "g": 4, "k": 4, "q": "質量分率が銅70.0%、亜鉛30.0%の合金（黄銅）の組成をモル分率で表したとき、銅のモル分率に最も近いものはどれか。原子量はCu＝63.5、Zn＝65.4とする。", "o": ["70.0%", "29.4%", "71.6%", "69.4%", "70.6%"], "a": 4, "e": "100 gで考えると Cu 70.0/63.5≒1.102 mol、Zn 30.0/65.4≒0.459 mol。Cuのモル分率は 1.102÷1.561≒0.706＝70.6%。Znのほうが原子量が大きいので、Cuのモル分率は質量分率より少し大きくなる。"}, {"id": "R7-4-5", "y": "R7", "g": 4, "k": 5, "q": "ヒトが体内で合成できず、食物から取る必要があるアミノ酸を必須アミノ酸という。次のうち必須アミノ酸はどれか。", "o": ["セリン", "グルタミン酸", "リシン", "グリシン", "アラニン"], "a": 2, "e": "ヒトの必須アミノ酸は、リシン、ロイシン、イソロイシン、バリン、トレオニン、メチオニン、フェニルアラニン、トリプトファン、ヒスチジンの9種類。"}, {"id": "R7-4-6", "y": "R7", "g": 4, "k": 6, "q": "ヒトの体を構成する元素のうち、質量の割合が最も大きいものはどれか。", "o": ["炭素", "窒素", "カルシウム", "酸素", "水素"], "a": 3, "e": "体の約6割が水であるため、質量では酸素が最も多く約6割強を占める。原子の数で数えると水素が最も多い。"}, {"id": "R3-5-1", "y": "R3", "g": 5, "k": 1, "q": "気候変動に対する企業や自治体などの取組に関する記述として、最も不適切なものはどれか。", "o": ["カーボンフットプリントは、企業が植林によって吸収した二酸化炭素の量を示す指標である", "TCFDの提言に沿って、気候変動が事業に与えるリスクと機会を開示する企業が増えている", "SBTは、科学的な根拠に基づいて企業が温室効果ガスの削減目標を設定する取組である", "RE100は、事業で使う電力を100%再生可能エネルギーでまかなうことを目指す国際的な取組である", "2050年までに二酸化炭素の排出実質ゼロを目指す「ゼロカーボンシティ」を表明する自治体が増えている"], "a": 0, "e": "カーボンフットプリントは、製品やサービスの原料調達から廃棄・リサイクルまでの全体で排出される温室効果ガスをCO₂に換算して示すもの。"}, {"id": "R3-5-2", "y": "R3", "g": 5, "k": 2, "q": "環境保全のための対策技術に関する記述として、最も不適切なものはどれか。", "o": ["石灰石を使う湿式の排煙脱硫では、副産物として石こうが得られる", "排煙脱硝では、アンモニアを用いて触媒上で窒素酸化物を窒素と水に還元する方法が広く使われている", "電気集じん装置は、帯電させたばいじんを電極に集めて除去する", "ダイオキシン類の発生は、ごみを200〜400℃程度の低温で燃焼させることで抑えられる", "活性汚泥法は、微生物の働きで排水中の有機物を分解する"], "a": 3, "e": "ダイオキシン類は不完全燃焼や排ガスがゆっくり冷えるときに生成しやすい。800℃以上の高温で完全燃焼させ、排ガスを急冷するのが対策。"}, {"id": "R3-5-5", "y": "R3", "g": 5, "k": 5, "q": "次の（ア）〜（オ）の科学技術の成果を年代の古い順に並べたものとして、最も適切なものはどれか。\n（ア）トランジスタの発明\n（イ）ベルによる電話の発明\n（ウ）ファラデーによる電磁誘導の発見\n（エ）ライト兄弟による動力飛行の成功\n（オ）ワットによる蒸気機関の改良", "o": ["ウ→オ→イ→エ→ア", "オ→ウ→イ→エ→ア", "オ→イ→ウ→エ→ア", "ウ→オ→エ→イ→ア", "オ→ウ→エ→イ→ア"], "a": 1, "e": "ワットの改良が1769年ごろ、電磁誘導1831年、電話1876年、動力飛行1903年、トランジスタ1947年。"}, {"id": "R3-5-6", "y": "R3", "g": 5, "k": 6, "q": "我が国の科学技術基本計画で提唱された、サイバー空間とフィジカル空間を高度に融合させたシステムにより、経済発展と社会的課題の解決を両立する人間中心の社会を何というか。", "o": ["ユビキタス社会", "スマートグリッド", "インダストリー4.0", "Society 4.0", "Society 5.0"], "a": 4, "e": "Society 5.0は第5期科学技術基本計画（2016年度〜）で提唱され、第6期科学技術・イノベーション基本計画（2021年度〜）でその実現が掲げられた。インダストリー4.0はドイツの製造業の高度化戦略。"}, {"id": "R4-5-1", "y": "R4", "g": 5, "k": 1, "q": "IPCC第6次評価報告書に関する記述として、最も不適切なものはどれか。", "o": ["温暖化への人間活動の影響は、依然として可能性が低いと評価した", "人間活動による二酸化炭素の累積排出量と気温上昇の間には、ほぼ比例の関係があるとした", "温暖化を1.5℃に抑えるには、世界のCO₂排出量を2050年ごろに正味ゼロにする必要があるとした", "人間の影響が大気、海洋及び陸域を温暖化させてきたことには疑う余地がないとした", "2011〜2020年の世界平均気温は、工業化前と比べて約1.1℃上昇したとした"], "a": 0, "e": "第6次評価報告書では、人間の影響による温暖化は「疑う余地がない」と、それまでで最も強い表現で評価された。"}, {"id": "R4-5-2", "y": "R4", "g": 5, "k": 2, "q": "我が国の廃棄物に関する記述として、最も不適切なものはどれか。", "o": ["廃棄物は、一般廃棄物と産業廃棄物に分けられる", "産業廃棄物の処理を委託する際には、マニフェスト（管理票）で流れを管理する", "産業廃棄物の年間排出量は、一般廃棄物の年間排出量より少ない", "一般廃棄物の処理は、市町村が責任をもつ", "産業廃棄物の処理責任は、それを排出した事業者にある"], "a": 2, "e": "産業廃棄物の排出量は年間約3.7億トンで、一般廃棄物（約4千万トン）のおよそ8〜9倍。"}, {"id": "R4-5-4", "y": "R4", "g": 5, "k": 4, "q": "水素に関する記述として、最も不適切なものはどれか。", "o": ["水素は天然ガスなどの化石燃料を改質して製造できる", "水素は燃焼しても二酸化炭素を排出しない", "水素は空気より重いため、漏れると低い場所にたまりやすい", "水素は常温・常圧では体積当たりのエネルギー量が小さい", "再生可能エネルギーの電力で水を電気分解して水素を製造できる"], "a": 2, "e": "水素は最も軽い気体で、漏れると上方へ拡散する。屋内では天井付近に滞留しないよう換気に注意する。"}, {"id": "R4-5-5", "y": "R4", "g": 5, "k": 5, "q": "科学技術とリスクの関わりに関する記述として、最も不適切なものはどれか。", "o": ["リスクを合理的に実行可能な限り低くするという考え方（ALARP）がある", "技術者はリスクを常にゼロにでき、ゼロリスクを保証すべきである", "リスクは、被害の大きさと発生確率の組合せで表されることが多い", "リスクコミュニケーションは、関係者の間で情報や意見を双方向にやり取りすることである", "科学的に不確実でも、深刻な被害のおそれがある場合は対策をとるという予防原則がある"], "a": 1, "e": "どのような技術にもリスクは残る（残留リスク）。リスクを許容できる水準まで下げ、残るリスクを正しく伝えることが重要。"}, {"id": "R4-5-6", "y": "R4", "g": 5, "k": 6, "q": "次の（ア）〜（オ）の科学史上の業績を年代の古い順に並べたものとして、最も適切なものはどれか。\n（ア）メンデレーエフによる元素の周期表の発表\n（イ）ニュートンによる万有引力の法則の発表\n（ウ）ワトソンとクリックによるDNA二重らせん構造の提唱\n（エ）レントゲンによるX線の発見\n（オ）アインシュタインによる特殊相対性理論の発表", "o": ["イ→ア→エ→ウ→オ", "イ→ア→オ→エ→ウ", "イ→エ→ア→オ→ウ", "イ→ア→エ→オ→ウ", "ア→イ→エ→オ→ウ"], "a": 3, "e": "万有引力（プリンキピア）1687年、周期表1869年、X線1895年、特殊相対性理論1905年、DNA二重らせん1953年。"}, {"id": "R5-5-1", "y": "R5", "g": 5, "k": 1, "q": "生物多様性国家戦略2023-2030に盛り込まれた、2030年までに陸域と海域のそれぞれ30%以上を保全することを目指す目標はどれか。", "o": ["20by20", "50by50", "100by100", "10by10", "30by30"], "a": 4, "e": "30by30（サーティ・バイ・サーティ）。国立公園などの保護地域に加え、企業林や里山など保護地域以外で保全に役立つ場所（OECM）の認定も進めている。"}, {"id": "R5-5-2", "y": "R5", "g": 5, "k": 2, "q": "大気汚染物質に関する記述として、最も不適切なものはどれか。", "o": ["二酸化窒素は、主に植物の光合成によって生じる", "光化学オキシダントは、窒素酸化物と揮発性有機化合物が紫外線で光化学反応して生じる", "PM2.5は、粒径がおおむね2.5 μm以下の微小粒子状物質である", "一酸化炭素は、主に燃料の不完全燃焼によって生じる", "二酸化硫黄は、主に化石燃料中の硫黄分の燃焼によって生じる"], "a": 0, "e": "二酸化窒素は主に自動車や工場などでの燃焼によって生じる窒素酸化物。光合成で放出されるのは酸素。"}, {"id": "R5-5-3", "y": "R5", "g": 5, "k": 3, "q": "日本のエネルギーに関する記述として、最も不適切なものはどれか。", "o": ["エネルギー自給率は1割程度と低い", "LNGは主に専用の船（LNG船）で輸入している", "発電電力量の電源構成で最も大きな割合を占めているのは原子力である", "一次エネルギー供給の大部分を化石燃料に依存している", "原油の輸入先は中東地域の比率が高い"], "a": 2, "e": "近年の発電電力量で最も割合が大きいのはLNG（天然ガス）火力で、次いで石炭火力。原子力の割合は東日本大震災以降大きく低下した。"}, {"id": "R5-5-4", "y": "R5", "g": 5, "k": 4, "q": "液化天然ガス（LNG）に関する記述として、最も不適切なものはどれか。", "o": ["液化すると体積が約600分の1になる", "主成分はメタンである", "燃焼時の二酸化炭素排出量は、石炭や石油に比べて少ない", "約−162℃に冷却して液化する", "常温のまま加圧すれば液化できるため、常温のタンクで貯蔵されている"], "a": 4, "e": "メタンは臨界温度が低く、常温では加圧しても液化しない。極低温で液化し、断熱した低温タンクで貯蔵する。常温で加圧して液化できるのはLPG（プロパンなど）。"}, {"id": "R5-5-5", "y": "R5", "g": 5, "k": 5, "q": "次の（ア）〜（オ）の労働者や消費者の安全に関する日本の出来事を年代の古い順に並べたものとして、最も適切なものはどれか。\n（ア）製造物責任法（PL法）の施行\n（イ）労働基準法の制定\n（ウ）消費者庁の発足\n（エ）労働安全衛生法の制定\n（オ）公害対策基本法の制定", "o": ["イ→エ→オ→ア→ウ", "イ→オ→ア→エ→ウ", "オ→イ→エ→ア→ウ", "イ→オ→エ→ア→ウ", "イ→オ→エ→ウ→ア"], "a": 3, "e": "労働基準法1947年、公害対策基本法1967年、労働安全衛生法1972年、PL法施行1995年、消費者庁発足2009年。"}, {"id": "R5-5-6", "y": "R5", "g": 5, "k": 6, "q": "科学と技術の関わりに関する記述として、最も不適切なものはどれか。", "o": ["原子核分裂の発見は、原子力発電の開発につながった", "X線の発見は、医療用の画像診断に応用された", "量子力学の発展は、半導体素子の開発の基盤となった", "蒸気機関は、熱力学の理論が確立した後に、その理論に基づいて初めて実用化された", "電磁誘導の発見は、発電機やモータの実用化につながった"], "a": 3, "e": "蒸気機関は経験と工夫によって先に実用化され、その効率を高める研究からカルノーらの熱力学が生まれた。技術が科学に先行した代表例。"}, {"id": "R6-5-1", "y": "R6", "g": 5, "k": 1, "q": "環境に関する条約や議定書の名称と概要の組合せとして、最も不適切なものはどれか。", "o": ["ラムサール条約：特に水鳥の生息地として国際的に重要な湿地の保全", "ストックホルム条約：酸性雨の原因物質である硫黄酸化物の排出削減", "バーゼル条約：有害廃棄物の国境を越える移動の規制", "モントリオール議定書：オゾン層を破壊する物質の規制", "ワシントン条約：絶滅のおそれのある野生動植物の国際取引の規制"], "a": 1, "e": "ストックホルム条約（POPs条約）は、PCBやダイオキシン類などの残留性有機汚染物質を規制する条約。"}, {"id": "R6-5-2", "y": "R6", "g": 5, "k": 2, "q": "我が国の産業廃棄物を種類別にみたとき、排出量が最も多いものはどれか。", "o": ["がれき類", "金属くず", "動物のふん尿", "汚泥", "廃プラスチック類"], "a": 3, "e": "汚泥が全体の4割余りを占めて最も多く、次いで動物のふん尿、がれき類の順。この3種類で全体の約8割になる。"}, {"id": "R6-5-5", "y": "R6", "g": 5, "k": 5, "q": "産業革命期の発明と人物の組合せとして、最も不適切なものはどれか。", "o": ["ジョン・ケイ：飛び杼", "カートライト：力織機", "アークライト：水力紡績機", "ハーグリーブス：ジェニー紡績機", "クロンプトン：蒸気機関車"], "a": 4, "e": "クロンプトンはミュール紡績機の発明者。蒸気機関車はトレビシックが初めて走らせ、スチーブンソンが実用化した。"}, {"id": "R6-5-6", "y": "R6", "g": 5, "k": 6, "q": "次の（ア）〜（オ）の科学史・技術史上の業績を年代の古い順に並べたものとして、最も適切なものはどれか。\n（ア）アレクサンダー・フレミングによるペニシリンの発見\n（イ）ボルタによる電池の発明\n（ウ）ジョン・フレミングによる二極真空管の発明\n（エ）マクスウェルによる電磁気学の基礎方程式の提示\n（オ）パスツールによる自然発生説の否定", "o": ["イ→オ→ウ→エ→ア", "イ→エ→オ→ウ→ア", "イ→オ→エ→ア→ウ", "イ→オ→エ→ウ→ア", "オ→イ→エ→ウ→ア"], "a": 3, "e": "ボルタ電池1800年、パスツールの白鳥の首フラスコ実験1861年、マクスウェルの方程式1864年、二極真空管1904年、ペニシリン1928年。2人のフレミングを混同しないこと。"}, {"id": "R7-5-1", "y": "R7", "g": 5, "k": 1, "q": "我が国の近年の気候変動対策に関する記述として、最も不適切なものはどれか。", "o": ["気候変動適応法に基づき、気候変動の影響に備える適応策を進めている", "2050年までに温室効果ガスの排出を全体としてゼロにする「2050年カーボンニュートラル」を目指している", "GX（グリーントランスフォーメーション）推進法が制定され、脱炭素と経済成長の両立を図っている", "2030年度に温室効果ガスを2013年度比で46%削減することを目指している", "日本は2020年にパリ協定から離脱した"], "a": 4, "e": "日本はパリ協定から離脱していない。2016年に締結し、締約国として削減目標（NDC）を提出している。"}, {"id": "R7-5-2", "y": "R7", "g": 5, "k": 2, "q": "プラスチックごみと資源循環に関する記述として、最も不適切なものはどれか。", "o": ["我が国の廃プラスチックの有効利用で最も割合が大きいのは、マテリアルリサイクルである", "ケミカルリサイクルは、廃プラスチックを化学的に分解して原料などに戻す方法である", "プラスチック資源循環促進法は、製品の設計から廃棄物の処理までの各段階で資源循環を促す法律である", "2020年7月から、小売店でのプラスチック製レジ袋の有料化が全国で義務化された", "一般に5 mm以下のプラスチック片をマイクロプラスチックという"], "a": 0, "e": "我が国の廃プラスチックの有効利用で最も多いのは、燃やして熱を利用するサーマルリサイクル（熱回収）で、全体の約6割を占める。"}, {"id": "R7-5-3", "y": "R7", "g": 5, "k": 3, "q": "2025年2月に閣議決定された第7次エネルギー基本計画に関する記述として、最も不適切なものはどれか。", "o": ["2040年度の電源構成の見通しで、再生可能エネルギーを最大の電源と位置付けている", "エネルギー安全保障と脱炭素を一体的に進める方針を示している", "安全性を大前提に、エネルギー安定供給、経済効率性、環境適合（S＋3E）を同時に実現するという基本的な考え方を維持している", "再生可能エネルギーの導入を抑制し、石炭火力を主力電源と位置付けている", "脱炭素効果の高い電源を最大限活用するとしている"], "a": 3, "e": "第7次計画は、2040年度に再生可能エネルギーを4〜5割程度とし最大の電源とする見通しを示した。石炭火力を主力電源とするものではない。"}, {"id": "R7-5-5", "y": "R7", "g": 5, "k": 5, "q": "科学史・技術史で著名な人物とその業績の組合せとして、最も不適切なものはどれか。", "o": ["ファラデー：電磁誘導の発見", "ダーウィン：『種の起源』による進化論の提唱", "ガリレオ・ガリレイ：振り子の等時性の発見", "ノーベル：ダイナマイトの発明", "エジソン：交流による送電方式の推進"], "a": 4, "e": "エジソンは直流送電を推進した。交流送電を推進したのはテスラやウェスティングハウスで、いわゆる「電流戦争」は交流が優勢となった。"}, {"id": "R7-5-6", "y": "R7", "g": 5, "k": 6, "q": "1995年に制定された科学技術基本法は、2021年施行の改正で人文・社会科学やイノベーションの創出も対象に加え、名称が変更された。改正後の名称はどれか。", "o": ["科学技術・学術振興法", "科学技術・イノベーション基本法", "イノベーション創出基本法", "知的財産基本法", "研究開発力強化法"], "a": 1, "e": "改正後は科学技術・イノベーション基本法。この法律に基づき5年ごとの基本計画が策定され、2021年度からは第6期科学技術・イノベーション基本計画となった。"}]);

/* 記録の保存（このブラウザ内のみ） */
const STORE_KEY = "gijutsushi-kiso-note-v1";
let store = { stats: {}, flags: [] };
let storageOK = true;
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      store = { stats: d.stats || {}, flags: Array.isArray(d.flags) ? d.flags : [] };
    }
  }catch(e){ storageOK = false; }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch(e){ storageOK = false; }
}

const settings = { mode: "exam", years: new Set(["R7","R6","R5","R4","R3"]), groups: new Set([1,2,3,4,5]), scope: "all", count: 10, order: "random" };
let session = null;
let resetArmed = false;
const app = document.getElementById("app");

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function isFlagged(id){ return store.flags.includes(id); }
function scopeFilter(q, scope){
  const s = store.stats[q.id];
  if(scope === "wrong") return !!s && s.last === false;
  if(scope === "unseen") return !s;
  if(scope === "flag") return isFlagged(q.id);
  return true;
}
function pool(){
  return QUESTIONS.filter(q => settings.years.has(q.y) && (settings.mode === "exam" || settings.groups.has(q.g)) && scopeFilter(q, settings.scope));
}

function renderCountdown(){
  const el = document.getElementById("countdown");
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const exam = new Date(2026, 10, 22);
  const d = Math.round((exam - today) / 86400000);
  if(d > 0) el.innerHTML = `<small>本番まで</small><b>${d}</b> 日<small>11月22日（日）基礎科目 15:00〜16:00</small>`;
  else if(d === 0) el.innerHTML = `<b>本番当日</b><small>基礎科目 15:00〜16:00</small>`;
  else el.innerHTML = `<small>試験日を過ぎました</small>`;
}

/* ホーム */
function renderHome(){
  session = null;
  const total = QUESTIONS.length;
  const seen = QUESTIONS.filter(q => store.stats[q.id]).length;
  const mastered = QUESTIONS.filter(q => store.stats[q.id] && store.stats[q.id].last).length;
  const wrongNow = QUESTIONS.filter(q => store.stats[q.id] && store.stats[q.id].last === false).length;

  let rows = "";
  for(const g of [1,2,3,4,5]){
    const qs = QUESTIONS.filter(q => q.g === g);
    const ok = qs.filter(q => store.stats[q.id] && store.stats[q.id].last).length;
    const pct = Math.round(ok / qs.length * 100);
    rows += `<div class="grp">
      <div class="name"><span>${g}群</span>${GROUPS[g]}</div>
      <div class="bar" role="img" aria-label="${GROUPS[g]} ${qs.length}問中${ok}問正解済み"><i style="width:${pct}%"></i></div>
      <div class="num">${ok} / ${qs.length}問</div>
    </div>`;
  }

  const incB = settings.years.has("B");
  const yearChips = [["no","類題のみ"],["yes","基本問題も含める"]].map(([v,label]) =>
    `<button class="chip" data-act="basic" data-v="${v}" aria-pressed="${(v === "yes") === incB}">${label}</button>`
  ).join("");
  const modeChips = [["exam","本番形式（各群3問・計15問）"],["free","群と問題数を選ぶ"]].map(([v,label]) =>
    `<button class="chip" data-act="mode" data-v="${v}" aria-pressed="${settings.mode === v}">${label}</button>`
  ).join("");
  const orderChips = [["random","ランダム"],["seq","群・番号順"]].map(([v,label]) =>
    `<button class="chip" data-act="order" data-v="${v}" aria-pressed="${settings.order === v}">${label}</button>`
  ).join("");

  const groupChips = [1,2,3,4,5].map(g =>
    `<button class="chip" data-act="group" data-g="${g}" aria-pressed="${settings.groups.has(g)}">${g}群 ${GROUPS[g]}</button>`
  ).join("");

  const scopes = [["all","すべて"],["wrong","間違えた問題"],["unseen","未解答"],["flag","付箋"]];
  const scopeChips = scopes.map(([k, label]) => {
    const n = QUESTIONS.filter(q => settings.years.has(q.y) && (settings.mode === "exam" || settings.groups.has(q.g)) && scopeFilter(q, k)).length;
    return `<button class="chip" data-act="scope" data-v="${k}" aria-pressed="${settings.scope === k}">${label}<small>${n}</small></button>`;
  }).join("");

  const counts = [[10,"10問"],[20,"20問"],[30,"30問"],[0,"すべて"]];
  const countChips = counts.map(([v, label]) =>
    `<button class="chip" data-act="count" data-v="${v}" aria-pressed="${settings.count === v}">${label}</button>`
  ).join("");

  const p = pool();
  const n = settings.mode === "exam"
    ? [1,2,3,4,5].reduce((t, g) => t + Math.min(3, p.filter(q => q.g === g).length), 0)
    : (settings.count ? Math.min(settings.count, p.length) : p.length);
  let warn = "";
  if(settings.years.size === 0) warn = "年度を1つ以上選んでください。";
  else if(settings.mode === "free" && settings.groups.size === 0) warn = "群を1つ以上選んでください。";
  else if(p.length === 0) warn = "条件に合う問題がありません。対象を「すべて」に切り替えてください。";

  app.innerHTML = `
  <section>
    <h2>群別の成績</h2>
    <div class="summary">
      <div>解いた問題　<b>${seen}</b> / ${total}</div>
      <div>正解済み　<b>${mastered}</b></div>
      <div>要復習　<b>${wrongNow}</b></div>
    </div>
    ${rows}
    <p class="muted">最後に解いたとき正解した問題の数です。全問正解済みになるまで「間違えた問題」を繰り返すのがおすすめです。</p>

    ${settings.mode === "free" ? `<div class="field"><div class="label">群</div><div class="chips">${groupChips}</div></div>` : ""}
    <div class="field"><div class="label">対象</div><div class="chips">${scopeChips}</div></div>
    ${settings.mode === "free" ? `<div class="field"><div class="label">問題数</div><div class="chips">${countChips}</div></div>
    <div class="field"><div class="label">出題順</div><div class="chips">${orderChips}</div></div>` : `<p class="muted">各群からランダムに3問ずつ選び、1群から5群の順に計15問を出題します。8問以上の正解（5割以上）が合格ラインです。</p>`}
    <button class="primary" data-act="start" ${warn ? "disabled" : ""}>${warn ? "出題する" : `${n}問を出題する`}</button>
    ${warn ? `<p class="warn">${warn}</p>` : ""}
  </section>

  <footer class="note">
    <p>収録問題は、過去5年分の基礎科目の各問と同じテーマ・同じ解き方の類題です（問題文と数値はオリジナルで、過去問そのものではありません）。統計値の更新で内容が古くなった問題は除いています。基本問題は頻出パターンの練習用です。全${total}問。</p>
    <p>${storageOK ? "記録はこのブラウザ内に保存されます。" : "このブラウザでは記録を保存できないため、ページを閉じると成績が消えます。"}</p>
    <p><button class="link" data-act="reset">${resetArmed ? "もう一度押すと、解答記録と付箋をすべて消去します" : "記録をすべて消去する"}</button></p>
  </footer>`;
}

/* 出題 */
function startSession(ids, exam){
  session = { queue: ids, idx: 0, results: [], answered: false, choice: null, exam: !!exam };
  renderQuiz();
}
function markSVG(ok){
  return ok
    ? `<svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><path pathLength="100" d="M62 16 C 90 14, 108 36, 106 62 C 104 90, 80 108, 56 106 C 30 104, 12 82, 15 56 C 18 34, 36 18, 66 20"/></svg>`
    : `<svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><path pathLength="100" d="M26 24 L96 98"/><path pathLength="100" d="M96 24 L24 96"/></svg>`;
}
function renderQuiz(){
  const id = session.queue[session.idx];
  const q = QMAP[id];
  const pos = session.idx + 1, len = session.queue.length;
  const answered = session.answered;
  const ok = answered && session.choice === q.a;

  const opts = q.o.map((t, i) => {
    let cls = "opt";
    if(answered && i === q.a) cls += " is-correct";
    if(answered && i === session.choice && i !== q.a) cls += " is-wrong";
    return `<li><button class="${cls}" data-act="answer" data-i="${i}" ${answered ? "disabled" : ""}><span class="n">${NUMS[i]}</span><span>${esc(t)}</span></button></li>`;
  }).join("");

  const isLast = pos === len;
  app.innerHTML = `
  <div class="qbar">
    <button class="ghost" data-act="quit">中断する</button>
    <div class="progress" aria-live="polite">${pos} / ${len}</div>
    <button class="ghost flag" data-act="flag" aria-pressed="${isFlagged(id)}">付箋</button>
  </div>
  <div class="ptrack"><i style="width:${(session.idx + (answered ? 1 : 0)) / len * 100}%"></i></div>
  <article class="sheet">
    ${answered ? markSVG(ok) : ""}
    <p class="gtag">${q.g}群　${GROUPS[q.g]}</p>
    <p class="qtext">${esc(q.q)}</p>
    ${q.fig ? `<div class="fig">${q.fig}</div>` : ""}
    <ol class="opts">${opts}</ol>
    ${answered ? `
    <div class="explain" role="status">
      <p class="verdict">${ok ? "正解" : "不正解"}　正解は${NUMS[q.a]}</p>
      <p>${esc(q.e)}</p>
    </div>` : ""}
  </article>
  <div class="next-row">
    <span class="keys">数字キー 1〜5 で解答、Enter で次へ</span>
    ${answered ? `<button class="primary" data-act="next" id="nextBtn">${isLast ? "結果を見る" : "次の問題へ"}</button>` : ""}
  </div>`;
  if(answered){ const b = document.getElementById("nextBtn"); if(b) b.focus(); }
}
function answer(i){
  if(!session || session.answered) return;
  const id = session.queue[session.idx];
  const q = QMAP[id];
  const ok = i === q.a;
  session.answered = true;
  session.choice = i;
  session.results.push({ id, choice: i, ok });
  const s = store.stats[id] || { n: 0, c: 0, last: false };
  s.n += 1; if(ok) s.c += 1; s.last = ok;
  store.stats[id] = s;
  save();
  renderQuiz();
}
function next(){
  if(!session || !session.answered) return;
  if(session.idx + 1 >= session.queue.length){ renderResult(); return; }
  session.idx += 1;
  session.answered = false;
  session.choice = null;
  renderQuiz();
  window.scrollTo(0, 0);
}

/* 結果 */
function renderResult(){
  const r = session.results;
  const okN = r.filter(x => x.ok).length;
  const misses = r.filter(x => !x.ok);
  const byG = {};
  r.forEach(x => {
    const g = QMAP[x.id].g;
    byG[g] = byG[g] || { n: 0, c: 0 };
    byG[g].n += 1; if(x.ok) byG[g].c += 1;
  });
  const gRows = Object.keys(byG).sort().map(g => {
    const pct = Math.round(byG[g].c / byG[g].n * 100);
    return `<div class="grp">
      <div class="name"><span>${g}群</span>${GROUPS[g]}</div>
      <div class="bar" role="img" aria-label="正答率${pct}%"><i style="width:${pct}%"></i></div>
      <div class="num">${byG[g].c} / ${byG[g].n}問</div>
    </div>`;
  }).join("");
  const missList = misses.map(x => {
    const q = QMAP[x.id];
    return `<div class="miss">
      <div class="muted">${q.g}群　${GROUPS[q.g]}</div>
      <p class="q">${esc(q.q)}</p>
      <div class="a">あなたの解答 ${NUMS[x.choice]}　／　正解 ${NUMS[q.a]} ${esc(q.o[q.a])}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
  <section>
    <h2>結果</h2>
    <p class="score">${okN} / ${r.length}<small>問正解（${Math.round(okN / r.length * 100)}%）</small></p>
    ${session.exam ? `<p style="font-weight:700;margin:10px 0 0;color:${okN >= Math.ceil(r.length / 2) ? "var(--ok)" : "var(--shu)"}">${okN >= Math.ceil(r.length / 2) ? "合格ラインに到達しました" : "合格ラインまであと" + (Math.ceil(r.length / 2) - okN) + "問"}（${r.length}問中${Math.ceil(r.length / 2)}問以上で5割）</p>` : ""}
  </section>
  <section>
    <h2>群別</h2>
    ${gRows}
  </section>
  ${misses.length ? `<section><h2>間違えた問題</h2>${missList}</section>` : ""}
  <div class="actions">
    ${misses.length ? `<button class="primary" data-act="retry">間違えた${misses.length}問をもう一度</button>` : ""}
    ${session.exam ? `<button class="ghost" data-act="start">別の15問で解く</button>` : ""}
    <button class="ghost" data-act="home">ホームに戻る</button>
  </div>`;
  session.missIds = misses.map(x => x.id);
  session.done = true;
}

/* 操作 */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act;
  if(act !== "reset") resetArmed = false;
  if(act === "group"){
    const g = Number(b.dataset.g);
    settings.groups.has(g) ? settings.groups.delete(g) : settings.groups.add(g);
    renderHome();
  } else if(act === "mode"){
    settings.mode = b.dataset.v; renderHome();
  } else if(act === "basic"){
    b.dataset.v === "yes" ? settings.years.add("B") : settings.years.delete("B");
    renderHome();
  } else if(act === "order"){
    settings.order = b.dataset.v; renderHome();
  } else if(act === "scope"){
    settings.scope = b.dataset.v; renderHome();
  } else if(act === "count"){
    settings.count = Number(b.dataset.v); renderHome();
  } else if(act === "start"){
    if(settings.mode === "exam"){
      const ids = [];
      for(const g of [1,2,3,4,5]) ids.push(...shuffle(pool().filter(q => q.g === g).map(q => q.id)).slice(0, 3));
      if(ids.length) startSession(ids, true);
      return;
    }
    const p = pool();
    if(settings.order === "seq") p.sort((a,b) => YORDER[a.y]-YORDER[b.y] || a.g-b.g || (a.k||0)-(b.k||0) || (a.id<b.id?-1:1));
    const ids = settings.order === "seq" ? p.map(q => q.id) : shuffle(p.map(q => q.id));
    const n = settings.count ? Math.min(settings.count, ids.length) : ids.length;
    if(n > 0) startSession(ids.slice(0, n));
  } else if(act === "answer"){
    answer(Number(b.dataset.i));
  } else if(act === "next"){
    next();
  } else if(act === "flag"){
    const id = session.queue[session.idx];
    if(isFlagged(id)) store.flags = store.flags.filter(x => x !== id);
    else store.flags.push(id);
    save();
    b.setAttribute("aria-pressed", String(isFlagged(id)));
  } else if(act === "quit"){
    renderHome();
  } else if(act === "retry"){
    startSession(shuffle(session.missIds.slice()));
  } else if(act === "home"){
    renderHome();
  } else if(act === "reset"){
    if(resetArmed){
      store = { stats: {}, flags: [] };
      save();
      resetArmed = false;
    } else {
      resetArmed = true;
    }
    renderHome();
  }
});
document.addEventListener("keydown", e => {
  if(!session || session.done) return;
  if(e.target.closest && e.target.closest("input,textarea")) return;
  if(!session.answered && /^[1-5]$/.test(e.key)){
    e.preventDefault();
    answer(Number(e.key) - 1);
  } else if(session.answered && e.key === "Enter" && !(e.target.dataset && e.target.dataset.act)){
    e.preventDefault();
    next();
  }
});

load();
renderCountdown();
renderHome();
</script>
</body>
